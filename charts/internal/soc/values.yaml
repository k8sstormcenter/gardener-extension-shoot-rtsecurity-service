# Values contract for the SOC stack chart.
#
# An extension renders a chart into a ManagedResource; it cannot run kubectl, read a
# file from the operator's machine or exec into a pod. So anything that needs to be
# discovered is either a value here or computed by pkg/values from the Cluster and
# Extension objects.

# Images. Overridable per shoot through providerConfig.images.
images:
  clickhouseOperator: "altinity/clickhouse-operator:0.26.0"
  pixieOperator: "gcr.io/pixie-oss/pixie-prod/operator-operator_image:0.1.7"
  # Digest-pinned upstream because :24.3 is a floating minor that repoints across
  # 24.3.x and matches no published patch tag. Keep the digest form.
  clickhouseKeeper: "clickhouse/clickhouse-keeper:24.3@sha256:163a91f5fec55376205437d9449dfe23d89ce8ef381e027b7fbbdbc872b0c2f0"
  clickhouseServer: "clickhouse/clickhouse-server:24.8"
  kubescapeOperator: "quay.io/kubescape/operator:v0.2.162"
  kubescapeStorage: "ghcr.io/k8sstormcenter/storage:rc-rogue-presave-4-95202d00@sha256:136db637d8edabc392c54f1458bc16507cbe2a40b2b6eb8413d8feb382b0e2c3"
  # Runs the two certgen init containers on storage. Pinned by digest like every other image:
  # the scripts have a /usr/bin/env bash shebang, and this image carries bash, env and sh under
  # /usr/bin only — there is no /bin/sh in it, so a hardcoded shebang would not resolve.
  certgenKubectl: "quay.io/kubescape/kubectl:1.36.1@sha256:e2b97dde9666986c61c56d49aae85a714b89b69392baa531438e74ec34096fb4"
  # Digest-pinned: the tag moves during a pre-release line.
  nodeAgent: "docker.io/entlein/duckling:v0.1.0-rogue91@sha256:716a2a8cdf0d360333e2afed30fce909c2c906258fe0f8f9bb3d50ef29692020"
  # Needs kubectl AND a shell. Two wrong answers already: bitnami/kubectl was withdrawn
  # from docker.io and resolves to NotFound, and registry.k8s.io/kubectl is distroless, so
  # its pod dies on exec /bin/sh. This image declares /bin/sh as its own default command.
  kubectl: "alpine/k8s:1.34.4"
  adaptiveExport: "docker.io/tanzeee/adaptive-export:0.16.50-6dc818c"
  # rc102 reads the attack suite's target.pod as the pod prefix, with service as a fallback,
  # and rejects a target naming neither. rc101 ignored the prefix and scored every pod in the
  # namespace, so the ARC controller and listener landed in the proof KPI alongside the
  # runners. Digest-pinned like the rest: this is a pre-release line, where the tag moves.
  dxDaemon: "docker.io/tanzeee/dx-daemon:0.6.0-shadow-rc109@sha256:d4e6ab107e56b650a5ec0a647879232023bb43d129216de4485019a1e284425d"

# Namespaces the stack occupies in the shoot. Kept as values because the shoot's
# own policies may force different ones.
namespaces:
  clickhouse: clickhouse
  honey: honey
  pixie: pl
  pixieOperator: px-operator

# Pixie is installed declaratively, as the operator plus a Vizier CR. The px CLI is not
# shipped into the shoot: `px deploy` creates the cloud ConfigMap and the deploy-key
# Secret as a side effect, and an extension cannot run a CLI. Rendering those objects
# directly is reproducible, so the CLI stays a human tool used from outside.
#
# clusterName is derived from the Shoot, not configurable. A cluster left at the operator
# default registers a new `default_<hash>` in the pixie cloud on every reinstall instead
# of reclaiming its own; a derived name cannot be forgotten and is stable across
# reinstalls of the same shoot. The cloud's namespace is flat, so two shoots with the
# same name in different projects would collide; Shoot.Status.TechnicalID
# (shoot--<project>--<name>) is already available to the actuator if that ever matters.
#
# cloudAddr MUST carry an explicit port. Without one the cloud client crash-loops.
pixie:
  enabled: true
  cloudAddr: ""
  vizierVersion: "0.14.19-noae1"  # the newest release/vizier tag in the fork; ships no adaptive-export, so GRM is its sole owner
  dataAccess: Full
  pemMemoryLimit: 4Gi
  pemMemoryRequest: 2Gi
  # Set by pkg/values from the Shoot name. Left empty here on purpose: an empty value in
  # a rendered chart means the actuator did not populate it, which is a bug to surface
  # rather than a default to silently accept.
  clusterName: ""

# Pixie credentials and the registry pull secrets.
#
# These arrive as gardener NamedResourceReferences: the Shoot lists them in
# spec.resources[], gardener mirrors each into the shoot namespace as ref-<name>, and
# pkg/values resolves them there. Referenced by name, never inlined, because
# providerConfig is part of the Shoot spec and readable by anyone who can read the Shoot.
# Empty here on purpose: a value present in a rendered chart means the Shoot declared it,
# absent means render without it.
credentials:
  pixieDeployKey: ""     # registers the vizier with the cloud
  pixieApiKey: ""        # adaptive-export and dx query the cloud API with it
  ducklingPullSecret: "" # raw .dockerconfigjson for the node-agent images
  tanzeeePullSecret: ""  # raw .dockerconfigjson for adaptive-export and dx-daemon


# ClickHouse.
#
# mode local is a ClickHouse per shoot: while the stack is this young, being able to drop
# the database and start over is worth more than not duplicating it. A central ClickHouse
# is the destination, so `central` stays wired from the start and the switch is a value
# change rather than a rewrite.
#
# Retention is set here rather than inherited: the upstream 30-day defaults are wrong for
# a small cluster, and most tables in the shipped DDL carry no TTL at all.
clickhouse:
  mode: local # local | central
  retentionHours: 24
  shards: 1
  replicas: 1
  storage: 5Gi
  keeper:
    replicas: 1
    storage: 512Mi
  # The operator and its CRDs ride in this chart so the extension is self-sufficient on
  # any shoot. A CRD and a CR of it in one ManagedResource can race on first apply (the CR
  # is rejected until the CRD is Established); GRM retries each sync, so the resource
  # reports ResourcesApplied=False briefly and then settles.
  deployOperator: true
  # The writer identity vector and adaptive-export use. The default is a placeholder, not
  # a secret: override it per shoot.
  ingest:
    user: ingest_writer
    password: changeme-ingest
  # Used only when mode=central.
  central:
    host: ""

# The workload this stack is here to profile and govern. Naming it is what lets the chart
# reason about it: until a signed-off profile for it exists, its namespace is kept out of
# the sensor, because an ungoverned workload is treated as deny-all from its first event
# and a scale set that bursts to hundreds of pods would emit an alert per distinct exec.
# Once profiles arrive the exclusion lifts by itself, so the loop needs no second switch.
# Workloads this cluster governs, one entry per PROFILE LABEL. Empty = use the singular
# `target` below, which is one entry's worth and what k3s-2 declares.
#
# Two levels of plurality, because the agent binds by label: an entry is one label plus the
# profile set it names, and it lists every scale set whose pods carry that label. nnf runs
# six scale sets under two labels, three per runner image, so it is two entries and not six.
# Each entry takes the same fields as `target`, with `scaleSetNames` in place of
# `scaleSetName`, and every guard below runs per entry: a delivery that satisfies one label
# says nothing about another, since the containers and the namespace can both differ.
targets: []

target:
  enabled: false
  namespace: arc-systems
  # The name every pod of the workload carries as kubescape.io/user-defined-profile, and
  # therefore the name of the one profile that governs all of them. Its pods are owned by a
  # per-job CR, so each job produces its own learned profile and only this label gives them
  # a single stable judge.
  #
  # This is the LABEL VALUE, which is not the scale set's name and must not be derived from
  # it. On k3s-2 the scale set is "k3s-2" and the label is "arc-runner". One field cannot
  # own both: used as the label it must match what the pods carry, and used as dx's pod-name
  # prefix it must match what the pods are called. Getting either wrong is silent — the
  # wrong label leaves the workload ungoverned, the wrong prefix makes dx score nothing and
  # report it as a KPI of zero.
  profileName: ""
  # The AutoscalingRunnerSet's name, which is the prefix its pods are named with. dx scores
  # pods matching "<namespace>/<scaleSetName>-runner-%", so this is read from the workload's
  # name and never from the profile label above.
  scaleSetName: ""
  # Every container the workload's pods run, by name. The label is per POD but a profile is
  # bound per CONTAINER: the agent binds "<profileName>-<container>", composes nothing, and a
  # container no document names is unresolved, which is ungoverned, which is deny-all.
  # Listing them here lets the chart refuse a delivery that would leave one out, instead of
  # finding out at the first burst.
  containers: [runner, dind]
  # Init containers are bound the same way and governed on the same terms: one that no
  # delivered document names is unresolved for the whole of its run. The guard checks the
  # union of this list and containers above by name, so it does not matter which list a
  # name sits in; a native sidecar may be declared in either.
  #
  # Empty here means "do not check", not "none exist", and a target that leaves it empty
  # while running an init container is ungoverned without saying so. It is empty only
  # because a chart-wide default cannot name a workload's containers: every target states
  # its own. A shoot that omits the field gets no check, which is the residual hole.
  initContainers: []

# Signed-off profiles and rules, fetched from git by the actuator and rendered verbatim.
# Filled in only when the Shoot's providerConfig names a repo, path and ref; the documents
# are whole YAML, not values, so nothing here describes their shape.
profiles:
  enabled: false
  # Either a list of {name, content} pairs, which is what the extension emits, or a map keyed by
  # filename with the document as the value. The map form exists because Helm deep-merges maps
  # across several valuesFrom sources but REPLACES a list: a delivery too large for one 1 MiB
  # ConfigMap has to arrive as a map, or only the last source survives and the guards below fail
  # on every profile that went missing. Both shapes render in the same order.
  #
  # Deliberately absent rather than defaulted to [] or {}: a default of either shape is coalesced
  # against the other and Helm prints "destination for profiles.documents is a table, ignoring
  # non-table value" on every render by the consumer using the shape the default is not. Absent
  # coalesces with both, and an absent value while enabled is caught by the render instead.
  # Fail the render when the delivered documents exceed this many bytes. 0 disables it. A Helm
  # release stores them twice, in values and in the manifest, so the ceiling is lower than the
  # compression ratio suggests; around 3.1 MB of profiles for a release that must stay under the
  # 1 MiB Secret limit. Off by default because the extension path has no release Secret and a
  # Helm-tuned number would fail a render that is fine.
  maxDocumentBytes: 0
  # Whether this release renders the profile objects themselves. It is NOT the same question as
  # enabled: enabled states that profiles exist for the target, which the rule-binding exclusion
  # reads to decide whether to govern the namespace, so a consumer that turns enabled off to move
  # the objects elsewhere also excludes the workload from the rule set and governs nothing.
  #
  # Set it false only on a consumer that applies the documents by another route, and point that
  # route at the delivery directory's own kustomization.yaml. A Helm release cannot hold both the
  # datastore Deployment and objects served by that datastore's aggregated API.
  renderObjects: true
  # Adds helm.sh/resource-policy: keep to each rendered profile, so a later release that stops
  # rendering them leaves the live objects alone. Helm decides that from the annotation in the
  # PREVIOUS release's manifest, not from who owns the object now, so the annotation has to be
  # in place one release BEFORE renderObjects is turned off; another owner adopting the objects
  # does not save them. Without it the objects are deleted on the flip and every governed
  # container is unresolved until the new owner recreates them, which is deny-all.
  #
  # It renders the document from its parsed form rather than verbatim, so it is off by default:
  # the default path applies the reviewed bytes exactly as signed off.
  keepOnRemoval: false

# Kubescape rules are data, not code: the rule set and its binding are rendered from the
# values below rather than taken from the upstream chart's defaults.
kubescape:
  enabled: true
  # Storage class of the kubescape-storage PVC; empty = the cluster default.
  storageClassName: local-path
  # Memory ceiling for the kubescape storage apiserver. Upstream ships 1500Mi, which this
  # cluster outgrew: storage reloads every ContainerProfile on start, and with ~3800 of them
  # (node timeseries snapshots that consolidation was not keeping up with) it measured 1422Mi
  # and was OOMKilled into CrashLoopBackOff, taking the aggregated APIService with it. A limit
  # is a ceiling, not a reservation, so raising it cannot cost more than the crash loop did.
  storageMemoryLimit: 4Gi
  # Whether the sensor reports DNS lookups that fail to resolve. Upstream ships false; this
  # stack runs true, because a failed lookup is the only trace a name-based exfiltration
  # leaves when the name never resolves, and without it that attack step is simply silent.
  # A knob rather than a literal so changing it does not need the vendored render touched
  # again; it feeds the sensor config, so changing it rolls the sensor.
  dnsReportFailures: true
  # Suggester: the node-agent derives a candidate profile itself and writes it to the
  # cluster as a ContainerProfile labelled kubescape.io/profile-role=suggestion. That is
  # the input to the signoff loop, so it is on, and scope must be full: at scope network
  # a request answers with peers only and never produces a whole candidate.
  #
  # The windows are sized for workloads that live minutes, not hours. initialDelay is how
  # long before the first chunk is written and maxSniffingTime is the window whose end
  # gates a suggestion, so the defaults (10m / 24h) mean a CI job that finishes in two
  # minutes is never suggested from while it runs. A container that exits always flushes a
  # complete profile regardless, so the small window buys a live candidate, not the
  # evidence itself. Per-workload override: label the pod template
  # kubescape.io/max-sniffing-time.
  suggester:
    enabled: true
    scope: full
    mode: whole
    maxPerMinute: 60
    timeout: 60s
    delta:
      enabled: true
      expiry: 24h
    peers:
      enabled: true
      crossNamespace: false
  learn:
    initialDelay: 15s
    updatePeriod: 30s
    maxSniffingTime: 10m
    # How often a host profile is rewritten. Arrived with the chunk-growth fix and defaults to
    # 30m upstream, which is 60x less often than the general update period: fewer rewrites means
    # fewer timeseries chunks, which is the growth this is meant to curb. The cost is freshness —
    # a host behaviour change can take this long to appear in the profile. Lower it only with the
    # chunk count in view; the conformance lane runs it at 30s and that is a test setting.
    hostProfileUpdatePeriod: 30m
    # Per-pod override for the target, whose pods live one job. The pod template carries it
    # as kubescape.io/max-sniffing-time, which beats the cluster-wide window above.
    runnerSniffingTime: 90s
  # Signing posture of the node-agent, written as .policy.mode of the trust policy
  # (node-agent-bundle-policy ConfigMap): default leaves the field out, which the agent
  # treats as alert; alert | enforce set it. Enforce refuses unsigned/unverifiable artifacts.
  mode: default
  # Namespaces the sensor ignores, verbatim from soc's kubescape values — soc is the
  # golden source for this list and the extension does not get its own opinion.
  # ONE list, because the alert binding must name the same namespaces: a namespace the
  # sensor skips produces no profiles at all, so rules bound there can never fire. The
  # sensor's list always wins, and keeping two of them is how a binding ends up promising
  # to watch something nothing watches.
  # The sensor's memory envelope. Exposed because it is the one figure that has to move per
  # cluster: a node cycling hundreds of short-lived containers holds far more profile state
  # than a quiet one, and until now raising it meant editing the vendored chart.
  nodeAgent:
    memory:
      limit: 1400Mi
      request: 180Mi
      # The Go heap target, which belongs BELOW the limit. Empty derives it at 80% of the
      # limit so raising one cannot leave the other behind; the render fails if an explicit
      # value sits at or above the limit, because then the kernel kills the sensor before the
      # runtime reclaims and the setting only looks configured. Kubernetes writes Mi, Go
      # writes MiB - the difference is real, not a typo.
      goMemLimit: 1120MiB
  # Namespaces the sensor WATCHES but the alert binding leaves out: learned, never judged.
  # The same shape as the target's own treatment while it has no signed-off profile. For
  # profiling a cluster's own system workloads, where a profile is wanted and alerts are
  # not. These must NOT also appear in excludeNamespaces - the sensor's list wins, so the
  # overlap learns nothing while reading as learn-only, and the render refuses it.
  learnOnlyNamespaces: []
  excludeNamespaces:
    - kubescape
    - kube-system
    - kube-public
    - kube-node-lease
    - kubeconfig
    - local-path-storage
    - gmp-system
    - gmp-public
    - storm
    - lightening
    - cert-manager
    - kube-flannel
    - ingress-nginx
    - honey
    - clickhouse
    - chain-loadgen
    - pl
    - olm
    - px-operator
    - tailscale-system
    - traefik
    - cilium-secrets
    - external-dns
  # The whole signed-off Rules document, fetched verbatim from git by the actuator when the
  # Shoot's providerConfig names profiles.rulesPath. When set it REPLACES the inline rule set
  # in templates/kubescape-rules.yaml; the binding below is rendered either way.
  rulesDocument: ""
  # Rules the set defines that are deliberately NOT bound. Every name here has to be a
  # decision someone made, because the alternative is what happened twice: a rule arrives in
  # a new signed-off set, nobody adds it to the binding, and it ships looking live while
  # bound to nothing. The render refuses a defined rule that is in neither list, so a new
  # rule forces a choice instead of defaulting to silence.
  unboundRules: []
  # Rules bound to every workload; narrow the list per shoot. The render refuses a name the
  # effective rule set does not define, so this list cannot drift from the rule set again.
  # These are candidate-3's 31 names, which are exactly the names the chart's own
  # files/default-rules.yaml defines: the two sets differ in tuning, not in membership.
  # Binding all 31 is safe because each rule carries its own enabled flag (candidate-3
  # disables R0003, R1003 and R1011), so the binding decides scope and the rule decides
  # whether it fires.
  rules:
    - "Unexpected process launched"
    - "Unexpected process arguments"
    - "Files Access Anomalies in container"
    - "Syscalls Anomalies in container"
    - "Linux Capabilities Anomalies in container"
    - "DNS Anomalies in container"
    - "Unexpected service account token access"
    - "Workload uses Kubernetes API unexpectedly"
    - "Read Environment Variables from procfs"
    - "eBPF Program Load"
    - "Unexpected Sensitive File Access"
    - "Unexpected Egress Network Traffic"
    - "Unexpected Ingress Network Traffic"
    - "Process executed from malicious source"
    - "Drifted process executed"
    - "Process tries to load a kernel module"
    - "Disallowed ssh connection"
    - "Process executed from mount"
    - "Fileless execution detected"
    - "Process tries to escape container"
    - "Crypto miner launched"
    - "Crypto Mining Domain Communication"
    - "Crypto Mining Related Port Communication"
    - "Soft link created over sensitive file"
    - "ld_preload hooks technique detected"
    - "Hard link created over sensitive file"
    - "Malicious Ptrace Usage"
    - "Unexpected io_uring Operation Detected"
    - "Kubelet TLS Exec Request Detected"
    - "Signed profile tampered"
    - "Exec to pod"
    - "DNS exfiltration attempt"

adaptiveExport:
  enabled: true

dx:
  enabled: true
  # Attack suite for the proof KPI; empty = the bundled redis suite (files/proof-suite.yaml).
  proofSuite: ""
  # Host binding for the findings receiver. Empty = none, which is the default: nothing in
  # this chart dials it over the host, the Service is already node-local, and hostPort 9099
  # collides with a CNI health port on at least one cluster running this chart, which
  # crashloops that CNI's agent on every node. Set it only for an external node-local
  # client, and then to a port the CNI does not use.
  hostPort: ""
  # The pod-name prefix dx scores on, for a cluster whose workload spans more than one
  # scale set. Empty = derived from the single declared scale set, which is what k3s-2 does.
  # BARE prefix, never namespace-qualified: the suite carries the namespace in its own key
  # and this chart sets it, so a qualified value is composed twice and matches nothing. The
  # qualified form ("<ns>/<prefix>") is the KPI document's scope.pod, a different field in a
  # different file; the render fails on a "/" here rather than let that be silent.
  podPrefix: ""
