# Values contract for the SOC stack chart.
#
# Everything the skaffolds discovered by reading the live cluster is a VALUE here
# instead. An extension renders a chart into a ManagedResource; it cannot run
# kubectl, read a developer's home directory, or exec into a pod, so anything the
# skaffold hooks did imperatively either moves into pkg/values (computed from the
# Cluster/Extension objects) or stops being necessary at all.

# Images. Pinned by the profile CRD in a real deployment; defaults exist so the
# chart renders standalone for tests.
images:
  clickhouseOperator: "altinity/clickhouse-operator:0.26.0"
  pixieOperator: "gcr.io/pixie-oss/pixie-prod/operator-operator_image:0.1.7"
  # Digest-pinned upstream because :24.3 is a floating minor that repoints across
  # 24.3.x and matches no published patch tag. Keep the digest form.
  clickhouseKeeper: "clickhouse/clickhouse-keeper:24.3@sha256:163a91f5fec55376205437d9449dfe23d89ce8ef381e027b7fbbdbc872b0c2f0"
  clickhouseServer: "clickhouse/clickhouse-server:24.8"
  kubescapeOperator: "quay.io/kubescape/operator:v0.2.162"
  kubescapeStorage: "ghcr.io/k8sstormcenter/storage:rc-rogue23"
  nodeAgent: "docker.io/entlein/duckling:v0.1.0-rogue66"
  vector: "timberio/vector:0.58.0-distroless-libc"
  adaptiveExport: "docker.io/tanzeee/adaptive-export:0.16.50-6dc818c"
  dxDaemon: "docker.io/tanzeee/dx-daemon:0.6.0-shadow-rc99"

# Namespaces the stack occupies in the shoot. Kept as values because the shoot's
# own policies may force different ones.
namespaces:
  clickhouse: clickhouse
  honey: honey
  pixie: pl
  pixieOperator: px-operator

# Replaces skaffold_adaptive_export.yaml before[2]: instead of patching the
# operator's pl-cloud-config to append :443, AE is given the address directly.
# The patch existed because AE inherited a ConfigMap it did not own; owning the
# env removes the race rather than working around it.
# Pixie is installed DECLARATIVELY, via the operator + Vizier CR
# (k8s/operator/deployment/sbob and k8s/vizier/sbob kustomizations in the pixie fork).
# The px binary is deliberately NOT shipped to the shoot: `px deploy` is a laptop
# workflow that creates pl-cloud-config and pl-deploy-secrets as a side effect, and an
# extension cannot run a CLI. Rendering those objects directly is both possible and
# reproducible, so the CLI is not needed in-cluster at all. px stays a human tool for
# `px auth` / `px run` from outside.
#
# clusterName is DERIVED FROM THE SHOOT, not an operator knob. pkg/values sets it from
# the Shoot name on the Cluster resource, which the actuator already reads. That is what
# stops the registration sprawl at source: edge4 left the name at the operator default
# and the pixie cloud now carries six `default_<hash>` registrations, five of them dead,
# because each reinstall registers a new one instead of reclaiming its own. A derived
# name cannot be forgotten and is stable across reinstalls of the same shoot.
#
# Tradeoff worth knowing: the pixie cloud namespace is flat, so two shoots with the same
# name in different projects would collide. Shoot.Status.TechnicalID
# (shoot--<project>--<name>) is already read by the actuator and avoids that if it ever
# matters; the plain shoot name is used because it is what a human recognises in the UI.
#
# cloudAddr MUST carry an explicit :443. Without it the AE cloud client crash-loops, and
# the skaffold worked around this by patching the operator's ConfigMap after the fact;
# giving AE the value directly removes the race instead of racing it.
pixie:
  enabled: true
  cloudAddr: "work.soc.k8sstormcenter.com:443"
  vizierVersion: "0.14.19-pemdq1"   # the fork's PEM line (ships the :50305 direct-query listener)
  dataAccess: Full
  pemMemoryLimit: 4Gi
  pemMemoryRequest: 2Gi
  # Set by pkg/values from the Shoot name. Left empty here on purpose: an empty value in
  # a rendered chart means the actuator did not populate it, which is a bug to surface
  # rather than a default to silently accept.
  clusterName: ""

# Pixie credentials, and the two registry PATs.
#
# None of these may be read from a filesystem: the skaffolds took them from
# ~/.pixie/keys.public.env, ~/.docker/config.json and
# ~/.registry-pull/tanzeee/config.json, which exist on one laptop and nowhere else.
# In a shoot they arrive as gardener NamedResourceReferences, resolved by the actuator and
# passed through here. They are referenced by name so the secret never enters the extension's
# providerConfig, which is part of the Shoot spec and therefore readable by anyone who
# can read the Shoot.
# Filled by pkg/values from the Shoot's spec.resources[] refs soc-pixie-deploy-key,
# soc-pixie-api-key, soc-pull-entlein and soc-pull-tanzeee (gardener mirrors each as ref-<name> into the shoot
# namespace). Empty here on purpose: a value present in a rendered chart means the Shoot
# declared it; absent means render without it.
credentials:
  pixieDeployKey: ""     # -> pl-deploy-secrets; registers the vizier
  pixieApiKey: ""        # -> pl-adaptive-export-secrets; AE and dx query the cloud API with it
  ducklingPullSecret: "" # PAT 1, docker.io/entlein — kubescape agent images; raw .dockerconfigjson
  tanzeeePullSecret: ""  # PAT 2, docker.io/tanzeee — adaptive-export and dx-daemon


# ClickHouse.
#
# mode: local for now — a ClickHouse per shoot, deliberately, because the stack is
# alpha enough that being able to nuke the database and start over is worth more than
# not duplicating it. THE CENTRAL ONE IS THE DESTINATION: the `forensic` cluster is
# exactly that, a central ClickHouse, and shoots will ship to it instead of running
# their own as soon as this extension works end to end. Keep `central` wired in the
# chart from the start so that switch is a value change rather than a rewrite.
#
# Retention is set here rather than inherited: the 30-day defaults are wrong for a
# small cluster, and the shipped DDL leaves 17 of 25 tables with no TTL at all —
# including dc_snoop, which was 234 MiB of a 329 MiB database on a measured rig.
clickhouse:
  mode: local # local | central
  retentionHours: 24
  shards: 1
  replicas: 1
  storage: 5Gi
  keeper:
    replicas: 1
    storage: 512Mi
  # The altinity operator and its CRDs are NOT rendered by this chart. A CRD and a CR of
  # that CRD in one ManagedResource is an ordering hazard: GRM applies the set without
  # waiting for the CRD to be established, so the CR can be rejected on first pass. The
  # operator therefore ships as its own, earlier ManagedResource. Until that exists this
  # chart assumes it is present.
  # The operator and its CRDs ride in this chart so the extension is self-sufficient on any
  # shoot. CRD and CR in one ManagedResource can race on first apply (the CR is rejected
  # until the CRD is Established); GRM retries each sync, so the resource reports
  # ResourcesApplied=False briefly and then settles. Accepted over depending on terraform.
  deployOperator: true
  # The writer identity vector and AE use. Defaults are soc's own tree/clickhouse-lab
  # values and are not secrets in soc either; override per shoot once they are.
  ingest:
    user: ingest_writer
    password: changeme-ingest
  # Used only when mode=central. Points at the forensic cluster's ClickHouse.
  central:
    host: ""

# Collectors are opt-in per shoot. vector defaults OFF because k3s-2 still carries a
# 162-day-old kubescape+vector install in honey from before this extension existed: a
# ManagedResource with the same names would make GRM overwrite that DaemonSet and
# ConfigMap, and delete them when the resource goes. Adopt, relocate or reset first.
vector:
  enabled: false

# Kubescape rules are data, not code: soc owns default-rules.yaml and
# rule-alert-binding.yaml and applies them with --server-side --force-conflicts
# because helm's alertCRD.installDefault is false. Rendered here instead.
kubescape:
  enabled: true
  # Storage class of the kubescape-storage PVC; empty = the cluster default.
  storageClassName: local-path
  # Signing posture of the node-agent, written as .policy.mode of the trust policy
  # (node-agent-bundle-policy ConfigMap): default leaves the field out, which the agent
  # treats as alert; alert | enforce set it. Enforce refuses unsigned/unverifiable artifacts.
  mode: default
  # Namespaces the sensor ignores entirely. Applied twice on purpose: as the operator's
  # excludeNamespaces and as the NotIn selector of the alert binding; one list, one owner.
  # The stack's own namespaces are in it so it does not alert on itself.
  excludeNamespaces:
    - kubescape
    - kube-system
    - kube-public
    - kube-node-lease
    - local-path-storage
    - gmp-system
    - gmp-public
    - storm
    - lightening
    - cert-manager
    - kube-flannel
    - ingress-nginx
    - honey
    - clickhouse
    - chain-loadgen
    - pl
    - olm
    - px-operator
    - tailscale-system
    - traefik
    - cilium-secrets
    - external-dns
  # Namespaces the alert binding leaves out. Narrower than excludeNamespaces on purpose:
  # pixie's own namespaces (pl, px-operator) stay bound so their SBoBs are enforced.
  bindingExcludeNamespaces:
    - kube-system
    - kube-public
    - kube-node-lease
    - kubeconfig
    - kubescape
    - kube-flannel
    - ingress-nginx
    - honey
    - clickhouse
    - local-path-storage
    - gmp-system
    - gmp-public
    - storm
    - lightening
    - cert-manager
  # Rules bound to every workload. The set is soc's default-rules.yaml; narrow it per shoot.
  rules:
    - "Unexpected process launched"
    - "Unexpected process arguments"
    - "Files Access Anomalies in container"
    - "Syscalls Anomalies in container"
    - "Linux Capabilities Anomalies in container"
    - "DNS Anomalies in container"
    - "Unexpected service account token access"
    - "Workload uses Kubernetes API unexpectedly"
    - "Process executed from malicious source"
    - "Process tries to load a kernel module"
    - "Drifted process executed"
    - "Disallowed ssh connection"
    - "Fileless execution detected"
    - "Crypto miner launched"
    - "Process executed from mount"
    - "Crypto Mining Related Port Communication"
    - "Crypto Mining Domain Communication"
    - "Read Environment Variables from procfs"
    - "eBPF Program Load"
    - "Soft link created over sensitive file"
    - "Unexpected Sensitive File Access"
    - "Hard link created over sensitive file"
    - "Exec to pod"
    - "Port forward"
    - "Unexpected Egress Network Traffic"
    - "Unexpected Ingress Network Traffic"
    - "Malicious Ptrace Usage"
    - "Unexpected io_uring Operation Detected"
    - "Kubelet TLS Exec Request Detected"
    - "Signed profile tampered"

adaptiveExport:
  enabled: true

dx:
  enabled: true
  # Attack suite for the proof KPI; empty = the bundled redis suite (files/proof-suite.yaml).
  proofSuite: ""
