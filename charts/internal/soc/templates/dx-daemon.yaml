{{- if .Values.dx.enabled }}
{{/*
The dx kustomize, rendered. dx is a honey component and stays there, beside the sensor
whose findings it acts on; only the addresses it dials point into the pixie namespace.

What it needs from pixie it cannot reach by reference: the vizier's jwt signing key and
cluster id are minted by the operator at first boot, in pixie's namespace, and a
secretKeyRef cannot cross namespaces. The mirror Job below copies exactly those two into
honey. The refs are deliberately not optional — a dx without them starts and silently
drops every hand-off, which is indistinguishable from a quiet cluster.
*/}}
---
apiVersion: v1
kind: Secret
metadata:
  name: dx-metastasis-ch
  namespace: {{ .Values.namespaces.honey }}
type: Opaque
stringData:
  http-url: http://{{ .Values.clickhouse.ingest.user }}:{{ .Values.clickhouse.ingest.password }}@{{ include "soc.clickhouse.host" . }}:8123/?database=forensic_db
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dx-kpi
  namespace: {{ .Values.namespaces.honey }}
data:
  cluster: {{ .Values.pixie.clusterName | quote }}
  oracle: ""
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dx-daemon
  namespace: {{ .Values.namespaces.honey }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dx-daemon-kssync
  namespace: {{ .Values.namespaces.honey }}
rules:
- apiGroups:
  - coordination.k8s.io
  resourceNames:
  - dx-kssync
  resources:
  - leases
  verbs:
  - get
  - update
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
- apiGroups:
  - ""
  resourceNames:
  - node-agent-bundle-policy
  resources:
  - configmaps
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dx-daemon-kubescape-reader
rules:
- apiGroups:
  - spdx.softwarecomposition.kubescape.io
  resources:
  - containerprofiles
  - rogueartifacts
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dx-daemon-kssync
  namespace: {{ .Values.namespaces.honey }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dx-daemon-kssync
subjects:
- kind: ServiceAccount
  name: dx-daemon
  namespace: {{ .Values.namespaces.honey }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dx-daemon-kubescape-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dx-daemon-kubescape-reader
subjects:
- kind: ServiceAccount
  name: dx-daemon
  namespace: {{ .Values.namespaces.honey }}
---
apiVersion: v1
kind: Service
metadata:
  name: dx-daemon
  namespace: {{ .Values.namespaces.honey }}
spec:
  internalTrafficPolicy: Local
  ports:
  - name: findings
    port: 9099
    targetPort: 9099
  selector:
    app: dx-daemon
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app: dx-daemon
  name: dx-daemon
  namespace: {{ .Values.namespaces.honey }}
spec:
  selector:
    matchLabels:
      app: dx-daemon
  template:
    metadata:
      labels:
        app: dx-daemon
    spec:
      containers:
      - env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: HOST_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: DX_CAPTURE_POLICY
          value: adaptive_base
        - name: DX_RECEIVER_TLS
          value: "1"
        - name: AE_CONTROL_ADDR
          value: https://adaptive-export-control.{{ .Values.namespaces.pixie }}.svc.cluster.local:9100
        - name: PX_API_KEY
          valueFrom:
            secretKeyRef:
              key: api-key
              name: dx-pixie-auth
        - name: PX_CLUSTER_ID
          valueFrom:
            secretKeyRef:
              key: cluster-id
              name: dx-pixie-auth
        - name: PX_CLOUD_ADDR
          valueFrom:
            secretKeyRef:
              key: cloud-addr
              name: dx-pixie-auth
        - name: DX_BENCH
          value: pemdirect
        - name: PL_JWT_SIGNING_KEY
          valueFrom:
            secretKeyRef:
              key: jwt-signing-key
              name: dx-vizier-direct
        - name: DX_VIZIER_DIRECT_ADDR
          value: vizier-query-broker-svc.{{ .Values.namespaces.pixie }}.svc.cluster.local:50300
        - name: PX_DISABLE_TLS
          value: "1"
        - name: DX_CLUSTER_MALIGNANT_HTTP
          valueFrom:
            secretKeyRef:
              key: http-url
              name: dx-metastasis-ch
        - name: DX_PX_TIMEOUT_S
          value: "90"
        - name: DX_TELEMETRY_CACHE
          value: "1"
        - name: DX_WORKERS
          value: "4"
        - name: DX_FOREST_SCOPE
          value: "1"
        - name: DX_PRECORRELATE_GRAPH
          value: "1"
        - name: DX_NARROW_WINDOW_BEFORE_MS
          value: "150"
        - name: DX_NARROW_WINDOW_AFTER_MS
          value: "150"
        - name: DX_EVIDENCE_GRAPH_CH
          value: {{ include "soc.clickhouse.httpURL" . }}
        image: {{ .Values.images.dxDaemon }}
        name: dx-daemon
        ports:
        - containerPort: 9099
          hostPort: 9099
          name: findings
        readinessProbe:
          httpGet:
            path: /healthz
            port: 9099
            scheme: HTTPS
          initialDelaySeconds: 3
          periodSeconds: 10
        resources:
          limits:
            cpu: "2"
            memory: 3Gi
          requests:
            cpu: 50m
            memory: 1Gi
      imagePullSecrets:
      - name: adaptive-export-pull
      serviceAccountName: dx-daemon
      terminationGracePeriodSeconds: 35
      tolerations:
      - operator: Exists
{{- end }}
