{{- if .Values.dx.enabled }}
{{/*
The dx kustomize, rendered into the pixie namespace rather than beside kubescape: dx
needs the vizier's cluster secrets (jwt signing key, cluster id), which the operator mints
at first boot and so cannot be rendered. Sharing the namespace turns a copy step into a
direct secretKeyRef. The refs are not optional: a dx without them runs and silently drops
every hand-off.

The Service below is how vector reaches dx, so it must stay a DNS name with
internalTrafficPolicy: Local: vector's http-sink uri is not VRL and cannot expand
${HOST_IP} at runtime, so the literal string reaches the URL parser and every finding is
dropped silently; Local keeps the hand-off on the node whose PEM dx queries.
*/}}
---
apiVersion: v1
kind: Secret
metadata:
  name: dx-metastasis-ch
  namespace: {{ .Values.namespaces.pixie }}
type: Opaque
stringData:
  http-url: http://{{ .Values.clickhouse.ingest.user }}:{{ .Values.clickhouse.ingest.password }}@{{ include "soc.clickhouse.host" . }}:8123/?database=forensic_db
---
# The attack suite dx scores its proof KPI against (bob example/redis/distros/attacks/
# redis-oss.yaml). Without it dx runs with "proof KPI OFF".
apiVersion: v1
kind: ConfigMap
metadata:
  name: dx-proof-suite
  namespace: {{ .Values.namespaces.pixie }}
data:
  suite.yaml: |
{{ .Values.dx.proofSuite | default (.Files.Get "files/proof-suite.yaml") | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dx-kpi
  namespace: {{ .Values.namespaces.pixie }}
data:
  cluster: {{ .Values.pixie.clusterName | quote }}
  oracle: ""
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dx-daemon
  namespace: {{ .Values.namespaces.pixie }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dx-daemon-kssync
  namespace: {{ .Values.namespaces.pixie }}
rules:
- apiGroups:
  - coordination.k8s.io
  resourceNames:
  - dx-kssync
  resources:
  - leases
  verbs:
  - get
  - update
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dx-daemon-kubescape-reader
rules:
- apiGroups:
  - spdx.softwarecomposition.kubescape.io
  resources:
  - containerprofiles
  - rogueartifacts
  verbs:
  - get
  - list
- apiGroups:
  - ""
  resourceNames:
  - node-agent-bundle-policy
  resources:
  - configmaps
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dx-daemon-kssync
  namespace: {{ .Values.namespaces.pixie }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dx-daemon-kssync
subjects:
- kind: ServiceAccount
  name: dx-daemon
  namespace: {{ .Values.namespaces.pixie }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dx-daemon-kubescape-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dx-daemon-kubescape-reader
subjects:
- kind: ServiceAccount
  name: dx-daemon
  namespace: {{ .Values.namespaces.pixie }}
---
apiVersion: v1
kind: Service
metadata:
  name: dx-daemon
  namespace: {{ .Values.namespaces.pixie }}
spec:
  internalTrafficPolicy: Local
  ports:
  - name: findings
    port: 9099
    targetPort: 9099
  selector:
    app: dx-daemon
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app: dx-daemon
  name: dx-daemon
  namespace: {{ .Values.namespaces.pixie }}
spec:
  selector:
    matchLabels:
      app: dx-daemon
  template:
    metadata:
      labels:
        app: dx-daemon
    spec:
      containers:
      - env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: HOST_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: DX_CAPTURE_POLICY
          value: adaptive_base
        - name: DX_RECEIVER_TLS
          value: "1"
        - name: DX_PROOF_SUITE
          value: /etc/dx/proof/suite.yaml
        - name: AE_CONTROL_ADDR
          value: https://adaptive-export-control.{{ .Values.namespaces.pixie }}.svc.cluster.local:9100
        - name: PX_API_KEY
          valueFrom:
            secretKeyRef:
              key: pixie-api-key
              name: pl-adaptive-export-secrets
        - name: PX_CLUSTER_ID
          valueFrom:
            secretKeyRef:
              key: cluster-id
              name: pl-cluster-secrets
        - name: PX_CLOUD_ADDR
          valueFrom:
            configMapKeyRef:
              key: PL_CLOUD_ADDR
              name: pl-cloud-config
        - name: DX_BENCH
          value: pemdirect
        - name: PL_JWT_SIGNING_KEY
          valueFrom:
            secretKeyRef:
              key: jwt-signing-key
              name: pl-cluster-secrets
        - name: DX_VIZIER_DIRECT_ADDR
          value: vizier-query-broker-svc.{{ .Values.namespaces.pixie }}.svc.cluster.local:50300
        - name: PX_DISABLE_TLS
          value: "1"
        - name: DX_CLUSTER_MALIGNANT_HTTP
          valueFrom:
            secretKeyRef:
              key: http-url
              name: dx-metastasis-ch
        - name: DX_PX_TIMEOUT_S
          value: "90"
        - name: DX_TELEMETRY_CACHE
          value: "1"
        - name: DX_WORKERS
          value: "4"
        - name: DX_FOREST_SCOPE
          value: "1"
        - name: DX_PRECORRELATE_GRAPH
          value: "1"
        - name: DX_NARROW_WINDOW_BEFORE_MS
          value: "150"
        - name: DX_NARROW_WINDOW_AFTER_MS
          value: "150"
        - name: DX_EVIDENCE_GRAPH_CH
          value: {{ include "soc.clickhouse.httpURL" . }}
        image: {{ .Values.images.dxDaemon }}
        name: dx-daemon
        ports:
        - containerPort: 9099
          hostPort: 9099
          name: findings
        readinessProbe:
          httpGet:
            path: /healthz
            port: 9099
            scheme: HTTPS
          initialDelaySeconds: 3
          periodSeconds: 10
        resources:
          limits:
            cpu: "2"
            memory: 3Gi
          requests:
            cpu: 50m
            memory: 1Gi
        volumeMounts:
        - name: proof-suite
          mountPath: /etc/dx/proof
          readOnly: true
      imagePullSecrets:
      - name: adaptive-export-pull
      serviceAccountName: dx-daemon
      volumes:
      - name: proof-suite
        configMap:
          name: dx-proof-suite
      terminationGracePeriodSeconds: 35
      tolerations:
      - operator: Exists
{{- end }}
