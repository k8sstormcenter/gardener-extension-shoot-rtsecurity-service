{{/*
ClickHouseKeeperInstallation, ported from soc tree/clickhouse-lab/keeper.yaml.

Upstream's comments are kept verbatim: they record operator behaviour that is not
recoverable by reading the CR (an unreferenced template is silently discarded, and the
binding only applies on create). Losing them would cost someone the same day twice.

Only what varies per shoot is parameterised; the digest pin becomes a value so the
version catalogue owns it rather than this file.
*/}}
apiVersion: clickhouse-keeper.altinity.com/v1
kind: ClickHouseKeeperInstallation
metadata:
  name: forensic-keeper
  namespace: {{ .Values.namespaces.clickhouse }}
spec:
  configuration:
    clusters:
    - name: keeper
      layout:
        replicasCount: {{ .Values.clickhouse.keeper.replicas }}
    settings:
      logger/level: information
      tcp_port: "2181"
  # Without this binding the operator IGNORES the templates below entirely and
  # substitutes its own defaults: image clickhouse-keeper:latest, no resources,
  # and NO persistent volume. A template that is defined but never referenced is
  # silently discarded — the CR reads as correct while none of it is applied.
  #
  # The binding is applied on CREATE (or when the CHK spec changes), NOT on a
  # no-op reconcile: an existing StatefulSet already rendered as :latest keeps
  # :latest even with this block present and a forced reconcile. Adding this to a
  # running cluster therefore needs `kubectl delete chk <name>` + re-apply, which
  # recreates the keeper. Verified both directions on a live cluster.
  defaults:
    templates:
      podTemplate: default
      dataVolumeClaimTemplate: default
  templates:
    podTemplates:
    - name: default
      spec:
        containers:
        - name: clickhouse-keeper
          # Digest-pinned: `:24.3` is a floating MINOR (it repoints across 24.3.x)
          # and matches none of the published 24.3.x patch tags, so it is not
          # traceable to a build. The digest is the only reproducible form.
          # This is the exact image verified running healthy on a live cluster.
          image: {{ .Values.images.clickhouseKeeper }}
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
    volumeClaimTemplates:
    - name: default
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.clickhouse.keeper.storage }}
