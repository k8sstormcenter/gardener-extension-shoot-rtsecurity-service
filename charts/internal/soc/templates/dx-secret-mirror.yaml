{{- if .Values.dx.enabled }}
{{/*
dx runs in honey; two of the values it needs are minted by the pixie operator at first
boot, in the pixie namespace. A secretKeyRef cannot cross namespaces, so something has to
copy them. The deploy scripts did it with kubectl on a developer's machine; here it is a
Job with RBAC scoped to exactly those two reads.

Idempotent and re-run on every reconcile, so a vizier that is reinstalled (new cluster id,
new signing key) is picked up without anyone remembering to do it. The api key and cloud
address are NOT mirrored: those are chart values, so they are written straight from here.
*/}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dx-secret-mirror
  namespace: {{ .Values.namespaces.honey }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dx-secret-mirror
  namespace: {{ .Values.namespaces.pixie }}
rules:
- apiGroups: [""]
  resources: [secrets]
  resourceNames: [pl-cluster-secrets]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dx-secret-mirror
  namespace: {{ .Values.namespaces.pixie }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: dx-secret-mirror}
subjects:
- kind: ServiceAccount
  name: dx-secret-mirror
  namespace: {{ .Values.namespaces.honey }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dx-secret-mirror
  namespace: {{ .Values.namespaces.honey }}
rules:
- apiGroups: [""]
  resources: [secrets]
  verbs: [get, create, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dx-secret-mirror-honey
  namespace: {{ .Values.namespaces.honey }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: dx-secret-mirror}
subjects:
- kind: ServiceAccount
  name: dx-secret-mirror
  namespace: {{ .Values.namespaces.honey }}
---
{{/*
The name carries a hash of what this Job would run. A Job's pod template is immutable, so
a changed image or address cannot be patched into an existing Job — it is silently kept at
the old spec, and the Job sits there failing while everything that depends on it waits. A
new hash is a new object, and GRM removes the previous one because it is no longer in the
resource set.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: dx-secret-mirror-{{ printf "%s|%s|%s|%s|%s" .Values.images.kubectl .Values.namespaces.pixie .Values.namespaces.honey .Values.pixie.cloudAddr (.Values.credentials.pixieApiKey | default "") | sha256sum | trunc 8 }}
  namespace: {{ .Values.namespaces.honey }}
spec:
  backoffLimit: 30
  template:
    metadata:
      labels: {app: dx-secret-mirror}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: dx-secret-mirror
      containers:
      - name: mirror
        image: {{ .Values.images.kubectl | quote }}
        command:
        - /bin/sh
        - -c
        - |
          set -e
          # The operator mints these at first boot, so the Job waits rather than failing:
          # on a fresh shoot it starts before the vizier has registered.
          until kubectl -n "$PL_NS" get secret pl-cluster-secrets >/dev/null 2>&1; do
            echo "waiting for pl-cluster-secrets in $PL_NS"; sleep 10
          done
          JWT=$(kubectl -n "$PL_NS" get secret pl-cluster-secrets -o jsonpath='{.data.jwt-signing-key}' | base64 -d)
          CID=$(kubectl -n "$PL_NS" get secret pl-cluster-secrets -o jsonpath='{.data.cluster-id}' | base64 -d)
          [ -n "$JWT" ] && [ -n "$CID" ] || { echo "pl-cluster-secrets is missing jwt-signing-key or cluster-id"; exit 1; }
          kubectl -n "$KS_NS" create secret generic dx-vizier-direct \
            --from-literal=jwt-signing-key="$JWT" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "$KS_NS" create secret generic dx-pixie-auth \
            --from-literal=api-key="$API_KEY" \
            --from-literal=cluster-id="$CID" \
            --from-literal=cloud-addr="$CLOUD_ADDR" \
            --dry-run=client -o yaml | kubectl apply -f -
          echo "mirrored into $KS_NS"
        env:
        - name: PL_NS
          value: {{ .Values.namespaces.pixie | quote }}
        - name: KS_NS
          value: {{ .Values.namespaces.honey | quote }}
        - name: CLOUD_ADDR
          value: {{ .Values.pixie.cloudAddr | quote }}
        - name: API_KEY
          value: {{ required "credentials.pixieApiKey is required: dx queries the cloud with it" .Values.credentials.pixieApiKey | quote }}
{{- end }}
