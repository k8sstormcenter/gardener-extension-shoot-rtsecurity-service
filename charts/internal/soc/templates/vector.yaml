{{- if .Values.vector.enabled }}
{{/*
vector, rendered from vector/vector 0.58.0 with soc tree/vector-lab/values.yaml. soc pins
"latest", which helm template rejects; 0.58.0 is what that resolved to on 2026-10-04.
Regenerate: helm template vector vector/vector --version 0.58.0 --namespace honey -f tree/vector-lab/values.yaml
and re-apply the substitutions (namespace, endpoints, credentials, image).
*/}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vector
  namespace: {{ .Values.namespaces.honey }}
  labels:
    helm.sh/chart: vector-0.58.0
    app.kubernetes.io/name: vector
    app.kubernetes.io/instance: vector
    app.kubernetes.io/component: Agent
    app.kubernetes.io/version: 0.58.0-distroless-libc
    app.kubernetes.io/managed-by: Helm
automountServiceAccountToken: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vector
  namespace: {{ .Values.namespaces.honey }}
  labels:
    helm.sh/chart: vector-0.58.0
    app.kubernetes.io/name: vector
    app.kubernetes.io/instance: vector
    app.kubernetes.io/component: Agent
    app.kubernetes.io/version: 0.58.0-distroless-libc
    app.kubernetes.io/managed-by: Helm
data:
  vector.yaml: |
{{ include "soc.vector.config" . | indent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vector
  labels:
    helm.sh/chart: vector-0.58.0
    app.kubernetes.io/name: vector
    app.kubernetes.io/instance: vector
    app.kubernetes.io/component: Agent
    app.kubernetes.io/version: 0.58.0-distroless-libc
    app.kubernetes.io/managed-by: Helm
rules:
- apiGroups:
  - ''
  resources:
  - namespaces
  - nodes
  - pods
  verbs:
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vector
  labels:
    helm.sh/chart: vector-0.58.0
    app.kubernetes.io/name: vector
    app.kubernetes.io/instance: vector
    app.kubernetes.io/component: Agent
    app.kubernetes.io/version: 0.58.0-distroless-libc
    app.kubernetes.io/managed-by: Helm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vector
subjects:
- kind: ServiceAccount
  name: vector
  namespace: {{ .Values.namespaces.honey }}
---
apiVersion: v1
kind: Service
metadata:
  name: vector-headless
  namespace: {{ .Values.namespaces.honey }}
  labels:
    helm.sh/chart: vector-0.58.0
    app.kubernetes.io/name: vector
    app.kubernetes.io/instance: vector
    app.kubernetes.io/component: Agent
    app.kubernetes.io/version: 0.58.0-distroless-libc
    app.kubernetes.io/managed-by: Helm
  annotations: null
spec:
  clusterIP: None
  ports:
  - name: api
    port: 8686
    protocol: TCP
    targetPort: 8686
  selector:
    app.kubernetes.io/name: vector
    app.kubernetes.io/instance: vector
    app.kubernetes.io/component: Agent
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: vector
  namespace: {{ .Values.namespaces.honey }}
  labels:
    helm.sh/chart: vector-0.58.0
    app.kubernetes.io/name: vector
    app.kubernetes.io/instance: vector
    app.kubernetes.io/component: Agent
    app.kubernetes.io/version: 0.58.0-distroless-libc
    app.kubernetes.io/managed-by: Helm
  annotations: null
spec:
  ports:
  - name: api
    port: 8686
    protocol: TCP
    targetPort: 8686
  selector:
    app.kubernetes.io/name: vector
    app.kubernetes.io/instance: vector
    app.kubernetes.io/component: Agent
  type: ClusterIP
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector
  namespace: {{ .Values.namespaces.honey }}
  labels:
    helm.sh/chart: vector-0.58.0
    app.kubernetes.io/name: vector
    app.kubernetes.io/instance: vector
    app.kubernetes.io/component: Agent
    app.kubernetes.io/version: 0.58.0-distroless-libc
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vector
      app.kubernetes.io/instance: vector
      app.kubernetes.io/component: Agent
  minReadySeconds: 0
  template:
    metadata:
      annotations:
        checksum/config: {{ include "soc.vector.config" . | sha256sum }}
      labels:
        app.kubernetes.io/name: vector
        app.kubernetes.io/instance: vector
        app.kubernetes.io/component: Agent
        vector.dev/exclude: 'true'
    spec:
      serviceAccountName: vector
      dnsPolicy: ClusterFirst
      containers:
      - name: vector
        image: {{ .Values.images.vector }}
        imagePullPolicy: IfNotPresent
        args:
        - --config-dir
        - /etc/vector/
        env:
        - name: VECTOR_LOG
          value: info
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: HOST_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: VECTOR_SELF_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: VECTOR_SELF_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: VECTOR_SELF_POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: PROCFS_ROOT
          value: /host/proc
        - name: SYSFS_ROOT
          value: /host/sys
        ports:
        - name: api
          containerPort: 8686
          protocol: TCP
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
        volumeMounts:
        - name: data
          mountPath: /vector-data-dir
        - name: config
          mountPath: /etc/vector/
          readOnly: true
        - mountPath: /var/log/
          name: var-log
          readOnly: true
        - mountPath: /var/lib
          name: var-lib
          readOnly: true
        - mountPath: /host/proc
          name: procfs
          readOnly: true
        - mountPath: /host/sys
          name: sysfs
          readOnly: true
      terminationGracePeriodSeconds: 60
      tolerations:
      - operator: Exists
      volumes:
      - name: config
        projected:
          sources:
          - configMap:
              name: vector
      - name: data
        hostPath:
          path: /var/lib/vector
      - hostPath:
          path: /var/log/
        name: var-log
      - hostPath:
          path: /var/lib/
        name: var-lib
      - hostPath:
          path: /proc
        name: procfs
      - hostPath:
          path: /sys
        name: sysfs
{{- end }}
