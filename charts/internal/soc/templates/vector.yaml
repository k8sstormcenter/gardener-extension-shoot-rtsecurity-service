{{- if .Values.vector.enabled }}
{{/*
vector, rendered from vector/vector 0.58.0 with soc tree/vector-lab/values.yaml. soc pins
"latest", which helm template rejects; 0.58.0 is what that resolved to on 2026-10-04.
Regenerate: helm template vector vector/vector --version 0.58.0 --namespace honey -f tree/vector-lab/values.yaml
and re-apply the substitutions (namespace, endpoints, credentials, image).
*/}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vector
  namespace: {{ .Values.namespaces.honey }}
  labels:
    helm.sh/chart: vector-0.58.0
    app.kubernetes.io/name: vector
    app.kubernetes.io/instance: vector
    app.kubernetes.io/component: Agent
    app.kubernetes.io/version: 0.58.0-distroless-libc
    app.kubernetes.io/managed-by: Helm
automountServiceAccountToken: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vector
  namespace: {{ .Values.namespaces.honey }}
  labels:
    helm.sh/chart: vector-0.58.0
    app.kubernetes.io/name: vector
    app.kubernetes.io/instance: vector
    app.kubernetes.io/component: Agent
    app.kubernetes.io/version: 0.58.0-distroless-libc
    app.kubernetes.io/managed-by: Helm
data:
  vector.yaml: "api:\n  address: 127.0.0.1:8686\n  enabled: true\ndata_dir: /vector-data-dir\n\
    sinks:\n  dx_daemon:\n    batch:\n      max_events: 1\n    buffer:\n      max_size:\
    \ 1073741824\n      type: disk\n      when_full: drop_newest\n    encoding:\n\
    \      codec: json\n    inputs:\n    - kubescape_enrich\n    method: post\n  \
    \  tls:\n      verify_certificate: false\n    type: http\n    uri: https://dx-daemon.{{ .Values.namespaces.honey }}.svc.cluster.local:9099/findings\n\
    \  kubescape_clickhouse:\n    auth:\n      password: {{ .Values.clickhouse.ingest.password }}\n      strategy:\
    \ basic\n      user: {{ .Values.clickhouse.ingest.user }}\n    batch:\n      max_bytes: 5000000\n   \
    \   timeout_secs: 2\n    database: forensic_db\n    date_time_best_effort: true\n\
    \    endpoint: {{ include "soc.clickhouse.httpEndpoint" . }}\n\
    \    inputs:\n    - kubescape_enrich\n    skip_unknown_fields: true\n    table:\
    \ kubescape_logs\n    type: clickhouse\n  kubescape_debug:\n    encoding:\n  \
    \    codec: json\n    inputs:\n    - kubescape_enrich\n    path: /tmp/kubescape.json\n\
    \    type: file\nsources:\n  kubescape_nodeagent_logs:\n    extra_label_selector:\
    \ app=node-agent\n    type: kubernetes_logs\ntransforms:\n  kubescape_enrich:\n\
    \    inputs:\n    - kubescape_filter\n    source: |\n      .CloudMetadata = \"\
    empty\"\n      .hostname = get_env_var!(\"NODE_NAME\")\n      ts, err = parse_timestamp(.BaseRuntimeMetadata.timestamp,\
    \ \"%+\")\n      # Transport the ORIGINAL kubescape timestamp at NANOSECOND resolution.\n\
    \      # Truncating to seconds (the to_unix_timestamp default) collapses the AE\n\
    \      # trigger watermark to 1s granularity and loses sub-second ordering. The\n\
    \      # forensic_db.kubescape_logs schema partitions/TTLs event_time as nanos\n\
    \      # (fromUnixTimestamp64Nano); AE normalizes seconds-or-nanos by magnitude.\n\
    \      # Sanity floor 2000-01-01: a Go zero time.Time serializes as a VALID\n\
    \      # RFC3339 (\"0001-01-01T00:00:00Z\"), so a missing/sentinel timestamp parses\n\
    \      # cleanly and would silently become the correlation anchor. Only a plausible\n\
    \      # epoch may anchor; anything else falls back to ingestion time.\n     \
    \ .event_time = to_unix_timestamp(now(), unit: \"nanoseconds\")\n      if err\
    \ == null {\n        ets = to_unix_timestamp(ts, unit: \"nanoseconds\")\n    \
    \    if ets > 946684800000000000 {\n          .event_time = ets\n        }\n \
    \     }\n      # MITRE enrichment: node-agent's BaseRuntimeAlert struct (armoapi-go)\n\
    \      # does not include mitreTactic / mitreTechnique fields, so they are\n \
    \     # absent from the alert payload even though they are defined on the\n  \
    \    # Rule. Inject them here from a static map (regenerate with\n      # ./build-values.sh\
    \ <path-to-default-rules.yaml> when rules change).\n      mitre_map = {\n    \
    \    \"R0001\": {\"tactic\": \"TA0002\", \"technique\": \"T1059\"},\n        \"\
    R0002\": {\"tactic\": \"TA0009\", \"technique\": \"T1005\"},\n        \"R0003\"\
    : {\"tactic\": \"TA0002\", \"technique\": \"T1059\"},\n        \"R0004\": {\"\
    tactic\": \"TA0002\", \"technique\": \"T1059\"},\n        \"R0005\": {\"tactic\"\
    : \"TA0011\", \"technique\": \"T1071.004\"},\n        \"R0006\": {\"tactic\":\
    \ \"TA0006\", \"technique\": \"T1528\"},\n        \"R0007\": {\"tactic\": \"TA0007\"\
    , \"technique\": \"T1613\"},\n        \"R0008\": {\"tactic\": \"TA0006\", \"technique\"\
    : \"T1552.001\"},\n        \"R0009\": {\"tactic\": \"TA0002\", \"technique\":\
    \ \"T1106\"},\n        \"R0010\": {\"tactic\": \"TA0006\", \"technique\": \"T1005\"\
    },\n        \"R0011\": {\"tactic\": \"TA0010\", \"technique\": \"T1041\"},\n \
    \       \"R0012\": {\"tactic\": \"TA0010\", \"technique\": \"T1041\"},\n     \
    \   \"R0040\": {\"tactic\": \"TA0002\", \"technique\": \"T1059\"},\n        \"\
    R1000\": {\"tactic\": \"TA0002\", \"technique\": \"T1059\"},\n        \"R1001\"\
    : {\"tactic\": \"TA0005\", \"technique\": \"T1036\"},\n        \"R1002\": {\"\
    tactic\": \"TA0005\", \"technique\": \"T1014\"},\n        \"R1003\": {\"tactic\"\
    : \"TA0008\", \"technique\": \"T1021.001\"},\n        \"R1004\": {\"tactic\":\
    \ \"TA0002\", \"technique\": \"T1059\"},\n        \"R1005\": {\"tactic\": \"TA0005\"\
    , \"technique\": \"T1620\"},\n        \"R1006\": {\"tactic\": \"TA0004\", \"technique\"\
    : \"T1611\"},\n        \"R1007\": {\"tactic\": \"TA0040\", \"technique\": \"T1496.001\"\
    },\n        \"R1008\": {\"tactic\": \"TA0011\", \"technique\": \"T1071.004\"},\n\
    \        \"R1009\": {\"tactic\": \"TA0040\", \"technique\": \"T1496.001\"},\n\
    \        \"R1010\": {\"tactic\": \"TA0006\", \"technique\": \"T1005\"},\n    \
    \    \"R1011\": {\"tactic\": \"TA0005\", \"technique\": \"T1574.006\"},\n    \
    \    \"R1012\": {\"tactic\": \"TA0006\", \"technique\": \"T1005\"},\n        \"\
    R1015\": {\"tactic\": \"TA0005\", \"technique\": \"T1055.008\"},\n        \"R1016\"\
    : {\"tactic\": \"TA0005\", \"technique\": \"T1562\"},\n        \"R1030\": {\"\
    tactic\": \"TA0005\", \"technique\": \"T1014\"},\n        \"R1031\": {\"tactic\"\
    : \"TA0002\", \"technique\": \"T1609\"},\n        \"R2000\": {\"tactic\": \"TA0002\"\
    , \"technique\": \"T1609\"}\n      }\n      rule_id = .RuleID || \"\"\n      m\
    \ = get(mitre_map, [rule_id]) ?? null\n      if m != null {\n        .BaseRuntimeMetadata.mitreTactic\
    \ = m.tactic\n        .BaseRuntimeMetadata.mitreTechnique = m.technique\n    \
    \  }\n      del(.time)\n    type: remap\n  kubescape_filter:\n    condition: .BaseRuntimeMetadata\
    \ != null\n    inputs:\n    - kubescape_parse\n    type: filter\n  kubescape_parse:\n\
    \    inputs:\n    - kubescape_nodeagent_logs\n    source: |\n      . = parse_json!(.message)\n\
    \    type: remap\n"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vector
  labels:
    helm.sh/chart: vector-0.58.0
    app.kubernetes.io/name: vector
    app.kubernetes.io/instance: vector
    app.kubernetes.io/component: Agent
    app.kubernetes.io/version: 0.58.0-distroless-libc
    app.kubernetes.io/managed-by: Helm
rules:
- apiGroups:
  - ''
  resources:
  - namespaces
  - nodes
  - pods
  verbs:
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vector
  labels:
    helm.sh/chart: vector-0.58.0
    app.kubernetes.io/name: vector
    app.kubernetes.io/instance: vector
    app.kubernetes.io/component: Agent
    app.kubernetes.io/version: 0.58.0-distroless-libc
    app.kubernetes.io/managed-by: Helm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vector
subjects:
- kind: ServiceAccount
  name: vector
  namespace: {{ .Values.namespaces.honey }}
---
apiVersion: v1
kind: Service
metadata:
  name: vector-headless
  namespace: {{ .Values.namespaces.honey }}
  labels:
    helm.sh/chart: vector-0.58.0
    app.kubernetes.io/name: vector
    app.kubernetes.io/instance: vector
    app.kubernetes.io/component: Agent
    app.kubernetes.io/version: 0.58.0-distroless-libc
    app.kubernetes.io/managed-by: Helm
  annotations: null
spec:
  clusterIP: None
  ports:
  - name: api
    port: 8686
    protocol: TCP
    targetPort: 8686
  selector:
    app.kubernetes.io/name: vector
    app.kubernetes.io/instance: vector
    app.kubernetes.io/component: Agent
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: vector
  namespace: {{ .Values.namespaces.honey }}
  labels:
    helm.sh/chart: vector-0.58.0
    app.kubernetes.io/name: vector
    app.kubernetes.io/instance: vector
    app.kubernetes.io/component: Agent
    app.kubernetes.io/version: 0.58.0-distroless-libc
    app.kubernetes.io/managed-by: Helm
  annotations: null
spec:
  ports:
  - name: api
    port: 8686
    protocol: TCP
    targetPort: 8686
  selector:
    app.kubernetes.io/name: vector
    app.kubernetes.io/instance: vector
    app.kubernetes.io/component: Agent
  type: ClusterIP
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector
  namespace: {{ .Values.namespaces.honey }}
  labels:
    helm.sh/chart: vector-0.58.0
    app.kubernetes.io/name: vector
    app.kubernetes.io/instance: vector
    app.kubernetes.io/component: Agent
    app.kubernetes.io/version: 0.58.0-distroless-libc
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vector
      app.kubernetes.io/instance: vector
      app.kubernetes.io/component: Agent
  minReadySeconds: 0
  template:
    metadata:
      annotations:
        checksum/config: c5cd81d2f8c17078c341cfc508689e60eb086e12c4aa4e5ca5a2d309f9fcf256
      labels:
        app.kubernetes.io/name: vector
        app.kubernetes.io/instance: vector
        app.kubernetes.io/component: Agent
        vector.dev/exclude: 'true'
    spec:
      serviceAccountName: vector
      dnsPolicy: ClusterFirst
      containers:
      - name: vector
        image: {{ .Values.images.vector }}
        imagePullPolicy: IfNotPresent
        args:
        - --config-dir
        - /etc/vector/
        env:
        - name: VECTOR_LOG
          value: info
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: HOST_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: VECTOR_SELF_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: VECTOR_SELF_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: VECTOR_SELF_POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: PROCFS_ROOT
          value: /host/proc
        - name: SYSFS_ROOT
          value: /host/sys
        ports:
        - name: api
          containerPort: 8686
          protocol: TCP
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
        volumeMounts:
        - name: data
          mountPath: /vector-data-dir
        - name: config
          mountPath: /etc/vector/
          readOnly: true
        - mountPath: /var/log/
          name: var-log
          readOnly: true
        - mountPath: /var/lib
          name: var-lib
          readOnly: true
        - mountPath: /host/proc
          name: procfs
          readOnly: true
        - mountPath: /host/sys
          name: sysfs
          readOnly: true
      terminationGracePeriodSeconds: 60
      tolerations:
      - operator: Exists
      volumes:
      - name: config
        projected:
          sources:
          - configMap:
              name: vector
      - name: data
        hostPath:
          path: /var/lib/vector
      - hostPath:
          path: /var/log/
        name: var-log
      - hostPath:
          path: /var/lib/
        name: var-lib
      - hostPath:
          path: /proc
        name: procfs
      - hostPath:
          path: /sys
        name: sysfs
{{- end }}
