{{- if .Values.profiles.enabled }}
{{/*
The signed-off profiles and rules, exactly as they are in git.
Rendered verbatim on purpose: each document is evidence that a human reviewed in a pull
request, so templating it here would mean the object running in the shoot is not the one
that was signed off. Whatever the review approved is what GRM applies, including the
annotations and signatures a governing profile needs.
Fetched by pkg/profiles at reconcile; absent from values until a Shoot asks for them.

The checks below are the deploy-time half of bob's harness/check_deploy.py, enforced again
here because CI guards the repository and this guards the cluster: a shoot can be pointed at
any ref, including one CI never saw. They fail the render rather than the cluster, because
the symptom in the cluster is either an alert storm or silence from workloads that are
ungoverned, and neither reports an error.

The contract, from bob example/github-runner/README.md: the pod template carries
kubescape.io/user-defined-profile: <label>, and the agent binds <label>-<container> per
container. It composes nothing and does not read the kubescape.io/profile-fragment labels,
so a fragment is not bindable and a flat <label> profile for a multi-container workload
binds nothing at all.
*/}}
{{- $byName := dict }}
{{- range .Values.profiles.documents }}
{{- $doc := fromYaml .content }}
{{- if and (not $doc.Error) (eq (dig "kind" "" $doc) "ContainerProfile") }}
{{- $_ := set $byName (dig "metadata" "name" "" $doc) $doc }}
{{- end }}
{{- end }}
{{/*
Every guard runs per target. A cluster running the same workload under several labels has
one profile set per label, and a delivery that satisfies one label says nothing about
another: the containers can differ, and so can the namespace.
*/}}
{{- range $t := fromJsonArray (include "soc.targets" .) }}
{{- if and $t.enabled $t.profileName }}
{{/*
A flat profile under the bare label is the failure that looks most like success: it is a
real ContainerProfile with the name everyone expects, and the agent binds none of it.
*/}}
{{- $all := concat $t.containers $t.initContainers }}
{{- if hasKey $byName $t.profileName }}
{{- $want := list }}
{{- range $all }}
{{- $want = append $want (printf "%s-%s" $t.profileName .) }}
{{- end }}
{{- fail (printf "%s is a flat profile for a workload running %d containers. The agent binds <label>-<container>, so a profile under the bare label binds nothing and every container stays ungoverned, which the sensor treats as deny-all. Author one profile per container: %s." $t.profileName (len $all) (join ", " $want)) }}
{{- end }}
{{- range $c := $all }}
{{- $want := printf "%s-%s" $t.profileName $c }}
{{- if not (hasKey $byName $want) }}
{{- fail (printf "container %q of %s/%s has no profile %q. A container no document names is unresolved, which the sensor treats as deny-all. Delivered: %v" $c $t.namespace $t.profileName $want (keys $byName | sortAlpha)) }}
{{- end }}
{{- $doc := get $byName $want }}
{{- $md := dig "metadata" (dict) $doc }}
{{- if dig "annotations" "kubescape.io/status" "" $md }}
{{- fail (printf "%s still carries the kubescape.io/status annotation of a learned profile. The sensor refuses such a document as a user-defined profile, so every pod naming it stays ungoverned. Strip it when authoring the profile." $want) }}
{{- end }}
{{- range $k, $v := (dig "labels" (dict) $md) }}
{{- if hasPrefix "kubescape.io/profile-fragment" $k }}
{{- fail (printf "%s carries the fragment label %q. Fragments are inputs that a compose step merges; the agent reads none of them, so a fragment delivered as a profile governs nothing. Deliver the composed profile." $want $k) }}
{{- end }}
{{- end }}
{{- $ns := dig "namespace" "" $md }}
{{- if and $ns (ne $ns $t.namespace) }}
{{- fail (printf "%s is namespaced %q but the workload runs in %q. A profile the agent cannot find in the pod's own namespace leaves the container unresolved." $want $ns $t.namespace) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{/*
Only ContainerProfiles are rendered into the shoot.

The directory is a delivery directory, not a pile of manifests: it also holds the
kustomization.yaml that Flux points at in production, which has to stay there. Rendering it
put a kustomize.config.k8s.io Kustomization into the ManagedResource, and GRM cannot apply
a kind with no CRD, so the whole apply failed PARTWAY — the DaemonSets took their new
images while the rule set and the profile ownership did not. A partial apply is worse than
a refused one, because the cluster ends up in a combination the chart would never render.

So a kustomize document is skipped, because it belongs there. Anything else that is not a
ContainerProfile fails the render, because a stray object or a mistyped kind is an error
and not an opt-out, and the shape guards above only ever examined documents that already
claimed to be profiles.
*/}}
{{/*
renderObjects is false for a consumer that applies the profiles itself rather than through this
release. It exists because a Helm release cannot hold both the datastore Deployment and objects
served by that datastore's aggregated API: Helm applies the Deployment before custom resources,
so its lookup of the profiles lands in the API-down window the same upgrade just opened, the
upgrade fails, and remediation rolls the datastore again and reopens the window. The extension
path does not have this problem, because the resource manager retries instead of rolling back,
so the default renders the objects and that path is unchanged.

The guards above still run. They validate the delivery, not the rendering, and a consumer that
applies the documents elsewhere needs them checked here just as much — more so, since nothing
downstream of it looks at the target's container list.
*/}}
{{- if ne .Values.profiles.renderObjects false }}
{{- $rendered := 0 }}
{{- range .Values.profiles.documents }}
{{- $doc := fromYaml .content }}
{{- if $doc.Error }}
{{- fail (printf "%s does not parse as YAML: %s" .name $doc.Error) }}
{{- end }}
{{- $kind := dig "kind" "" $doc }}
{{- $api := dig "apiVersion" "" $doc }}
{{- if hasPrefix "kustomize.config.k8s.io/" $api }}
{{- /* a build file for the GitOps path, not a deliverable */}}
{{- else if ne $kind "ContainerProfile" }}
{{- fail (printf "%s is a %q, not a ContainerProfile. The profiles path delivers container profiles; an object of another kind is applied into the shoot as-is and fails the whole ManagedResource if its kind has no CRD, which leaves the stack partly applied." .name (default "<none>" $kind)) }}
{{- else }}
{{- $rendered = add1 $rendered }}
---
# {{ .name }}
{{ .content }}
{{- end }}
{{- end }}
{{/*
A directory holding only build files would otherwise render nothing while profiles.enabled
is true: the stack would install, report success, and govern nothing.
*/}}
{{- if eq $rendered 0 }}
{{- fail (printf "profiles.path delivered %d documents and none of them is a ContainerProfile. The workload would be left ungoverned by an install that reports success." (len .Values.profiles.documents)) }}
{{- end }}
{{- end }}
{{- end }}
