{{- /* One pull secret per registry, in every namespace whose workloads pull from it. */ -}}
{{- range $ns := list .Values.namespaces.honey .Values.namespaces.pixie }}
{{- if $.Values.credentials.ducklingPullSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: duckling-pull
  namespace: {{ $ns }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ $.Values.credentials.ducklingPullSecret | b64enc }}
{{- end }}
{{- if $.Values.credentials.tanzeeePullSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: adaptive-export-pull
  namespace: {{ $ns }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ $.Values.credentials.tanzeeePullSecret | b64enc }}
{{- end }}
{{- end }}
{{- if .Values.credentials.pixieDeployKey }}
---
apiVersion: v1
kind: Secret
metadata:
  name: pl-deploy-secrets
  namespace: {{ .Values.namespaces.pixie }}
type: Opaque
data:
  deploy-key: {{ .Values.credentials.pixieDeployKey | b64enc }}
{{- end }}
