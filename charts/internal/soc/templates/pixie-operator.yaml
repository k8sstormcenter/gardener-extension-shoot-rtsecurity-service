{{- if .Values.pixie.enabled }}
{{/*
Pixie operator, rendered from the pixie fork's k8s/operator/deployment/base kustomize —
the non-OLM path pixie itself ships. rocky-1 got the same operator (0.1.7) through OLM via
`px deploy`; OLM is not needed to run a Deployment, so it is not carried here.
Regenerate: kubectl kustomize k8s/operator/deployment/base, substitute image + namespace.
*/}}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.pixieOperator }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app: pixie-operator
    component: pixie-operator
  name: pixie-operator-service-account
  namespace: {{ .Values.namespaces.pixieOperator }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app: pixie-operator
    component: pixie-operator
  name: pixie-operator-role
rules:
- apiGroups:
  - ''
  - apps
  - rbac.authorization.k8s.io
  - extensions
  - etcd.database.coreos.com
  - batch
  - nats.io
  - policy
  - apiextensions.k8s.io
  - px.dev
  resources:
  - clusterroles
  - clusterrolebindings
  - configmaps
  - customresourcedefinitions
  - secrets
  - pods
  - events
  - services
  - deployments
  - daemonsets
  - nodes
  - persistentvolumes
  - persistentvolumeclaims
  - roles
  - rolebindings
  - serviceaccounts
  - etcdclusters
  - statefulsets
  - cronjobs
  - jobs
  - natsclusters
  - poddisruptionbudgets
  - viziers
  - viziers/status
  - podsecuritypolicies
  verbs:
  - '*'
- apiGroups:
  - storage.k8s.io
  - ''
  resources:
  - storageclasses
  - namespaces
  - csidrivers
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app: pixie-operator
    component: pixie-operator
  name: pixie-operator-cluster-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pixie-operator-role
subjects:
- kind: ServiceAccount
  name: pixie-operator-service-account
  namespace: {{ .Values.namespaces.pixieOperator }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: pixie-operator
    component: pixie-operator
  name: vizier-operator
  namespace: {{ .Values.namespaces.pixieOperator }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pixie-operator
      component: pixie-operator
      name: vizier-operator
  template:
    metadata:
      labels:
        app: pixie-operator
        component: pixie-operator
        name: vizier-operator
        plane: control
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/os
                operator: Exists
              - key: kubernetes.io/os
                operator: In
                values:
                - linux
            - matchExpressions:
              - key: beta.kubernetes.io/os
                operator: Exists
              - key: beta.kubernetes.io/os
                operator: In
                values:
                - linux
      containers:
      - image: {{ .Values.images.pixieOperator }}
        name: app
      serviceAccountName: pixie-operator-service-account
      tolerations:
      - effect: NoSchedule
        key: kubernetes.io/arch
        operator: Equal
        value: amd64
      - effect: NoExecute
        key: kubernetes.io/arch
        operator: Equal
        value: amd64
      - effect: NoSchedule
        key: kubernetes.io/arch
        operator: Equal
        value: arm64
      - effect: NoExecute
        key: kubernetes.io/arch
        operator: Equal
        value: arm64
{{- end }}
