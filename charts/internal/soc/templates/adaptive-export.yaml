{{- if .Values.adaptiveExport.enabled }}
{{/*
k8s/vizier/adaptive_export kustomize from the pixie fork, rendered. The skaffold hooks
are gone on purpose: the Service selector is declared here (nothing pre-creates a wrong
one on a shoot), :443 is in pixie.cloudAddr, the schema-drift drop is unnecessary on a
ClickHouse that is created with the stack and nuked with it.
*/}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pl-adaptive-export-service-account
  namespace: {{ .Values.namespaces.pixie }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pl-adaptive-export-role
  namespace: {{ .Values.namespaces.pixie }}
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pl-adaptive-export-cluster-role
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
- apiGroups:
  - spdx.softwarecomposition.kubescape.io
  resources:
  - containerprofiles
  - rogueartifacts
  verbs:
  - get
  - list
- apiGroups:
  - ""
  resourceNames:
  - node-agent-bundle-policy
  resources:
  - configmaps
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pl-adaptive-export-binding
  namespace: {{ .Values.namespaces.pixie }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pl-adaptive-export-role
subjects:
- kind: ServiceAccount
  name: pl-adaptive-export-service-account
  namespace: {{ .Values.namespaces.pixie }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pl-adaptive-export-cluster-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pl-adaptive-export-cluster-role
subjects:
- kind: ServiceAccount
  name: pl-adaptive-export-service-account
  namespace: {{ .Values.namespaces.pixie }}
---
apiVersion: v1
kind: Service
metadata:
  name: adaptive-export-control
  namespace: {{ .Values.namespaces.pixie }}
spec:
  internalTrafficPolicy: Local
  ports:
  - name: control
    port: 9100
    targetPort: 9100
  selector:
    name: adaptive-export
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    name: adaptive-export
    plane: control
  name: adaptive-export
  namespace: {{ .Values.namespaces.pixie }}
spec:
  selector:
    matchLabels:
      name: adaptive-export
  template:
    metadata:
      labels:
        name: adaptive-export
        plane: control
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/os
                operator: In
                values:
                - linux
      containers:
      - env:
        - name: HOST_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: AE_PPROF_ADDR
          value: 127.0.0.1:6061
        - name: ADAPTIVE_VIZIER_DIRECT_ADDR
          value: $(HOST_IP):50305
        - name: PL_JWT_SIGNING_KEY
          valueFrom:
            secretKeyRef:
              key: jwt-signing-key
              name: pl-cluster-secrets
        - name: PX_DISABLE_TLS
          value: "1"
        - name: PL_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: PIXIE_API_KEY
          valueFrom:
            secretKeyRef:
              key: pixie-api-key
              name: pl-adaptive-export-secrets
        - name: CLICKHOUSE_DSN
          valueFrom:
            secretKeyRef:
              key: clickhouse-dsn
              name: pl-adaptive-export-secrets
        - name: KUBESCAPE_TABLE
          value: kubescape_logs
        - name: EXPORT_MODE
          value: never
        - name: CONTROL_ADDR
          value: :9100
        - name: ADAPTIVE_PUSH_PIXIE_ROWS
          value: "true"
        - name: ADAPTIVE_TRIGGER_POLL
          value: "false"
        - name: ADAPTIVE_MIGRATE_ENGINES
          value: "true"
        - name: ADAPTIVE_RECONCILE
          value: "true"
        - name: DEPLOY_TRACEPOINTS
          value: "true"
        - name: INSTALL_PRESET_SCRIPTS
          value: "false"
        - name: ADAPTIVE_MAX_INFLIGHT_QUERIES_GLOBAL
          value: "4"
        - name: ADAPTIVE_ORDER_CHUNK_SEC
          value: "600"
        - name: VERBOSE
          value: "true"
        image: {{ .Values.images.adaptiveExport }}
        name: adaptive-export
        ports:
        - containerPort: 9100
          hostPort: 9100
          name: control
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /certs
          name: certs
          readOnly: true
      imagePullSecrets:
      - name: adaptive-export-pull
      securityContext:
        fsGroup: 10100
        runAsGroup: 10100
        runAsNonRoot: true
        runAsUser: 10100
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: pl-adaptive-export-service-account
      volumes:
      - name: certs
        secret:
          secretName: service-tls-certs
{{- end }}
