{{- if .Values.kubescape.enabled }}
{{/*
One rule set, from one of two places, through one code path.

The signed-off set from git (profiles.rulesPath, fetched at the same ref as the profiles and
the attack suite) REPLACES the chart's own rather than joining it: a rule set is not its
names, and the tuning a review approves — opcode filters, dedup windows, suffix lists,
per-rule supportPolicy — exists only in the whole document. Both paths are documents so the
guards below apply to the chart's own set too, which is how the binding drift was found.

The chart's own set lives in files/default-rules.yaml rather than inline here, because a
rule set that is a literal in a template cannot be read back: nothing could check what it
defines. It goes through tpl because it interpolates the namespace.
*/}}
{{- $doc := .Values.kubescape.rulesDocument }}
{{- $from := "profiles.rulesPath" }}
{{- if not $doc }}
{{- $doc = tpl (.Files.Get "files/default-rules.yaml") . }}
{{- $from = "the chart's files/default-rules.yaml" }}
{{- end }}
{{/*
Each guard below is a failure that is otherwise silent. A shoot with no rules, or a binding
that names rules nobody defined, looks exactly like a quiet cluster: no error anywhere, and
nothing watching the workloads.
*/}}
{{- $r := fromYaml $doc }}
{{- if $r.Error }}
{{- fail (printf "%s does not parse as YAML: %s. It is the only rule set, so the shoot would run with none at all." $from $r.Error) }}
{{- end }}
{{- if ne (dig "kind" "" $r) "Rules" }}
{{- fail (printf "%s is a %q, not a Rules object. It is the only rule set, so the shoot would run with none at all." $from (dig "kind" "<none>" $r)) }}
{{- end }}
{{/*
The document carries its own namespace, and it replaces the chart's object by name. If the
two namespaces disagree the chart's set is suppressed and the fetched one lands somewhere
the sensor is not looking: rules installed, nothing watching, no error.
*/}}
{{- $ns := dig "metadata" "namespace" "" $r }}
{{- if and $ns (ne $ns .Values.namespaces.honey) }}
{{- fail (printf "%s is namespaced %q but this stack runs in %q. It replaces the chart's rule set by name, so the shoot would end up with its rules in a namespace the sensor does not read." $from $ns .Values.namespaces.honey) }}
{{- end }}
{{- $spec := dig "spec" "rules" (list) $r }}
{{- if not $spec }}
{{- fail (printf "%s is a Rules object with an empty spec.rules. The shoot would run with no rules at all." $from) }}
{{- end }}
{{/*
The binding names rules by name, and the rule set defines them by name: two lists, so they
can disagree. A bound name that nothing defines binds nothing, which is a rule everyone
believes is live and that can never fire. The reverse — a defined rule nobody binds — is a
deliberate per-shoot choice and stays allowed.
*/}}
{{- $defined := list }}
{{- range $spec }}
{{- $defined = append $defined (dig "name" "" .) }}
{{- end }}
{{- $unknown := list }}
{{- range .Values.kubescape.rules }}
{{- if not (has . $defined) }}
{{- $unknown = append $unknown . }}
{{- end }}
{{- end }}
{{- if $unknown }}
{{- fail (printf "kubescape.rules binds %v, which %s does not define. A bound name that nothing defines binds nothing: the rule looks live and can never fire. Defined names: %v" $unknown $from $defined) }}
{{- end }}
---
{{ $doc }}
# The binding stays ours either way: which rules fire on which namespaces is a per-shoot
# decision, not part of the signed-off rule set.
---
apiVersion: kubescape.io/v1
kind: RuntimeRuleAlertBinding
metadata:
  name: all-rules-all-pods
spec:
  namespaceSelector:
    matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values: {{ include "soc.kubescape.bindingExcludeNamespaces" . }}
  rules:
{{- range .Values.kubescape.rules }}
    - ruleName: {{ . | quote }}
{{- end }}
{{- end }}
