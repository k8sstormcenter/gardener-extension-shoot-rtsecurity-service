{{- if .Values.kubescape.enabled }}
{{/*
Static render of the kubescape-operator chart: runtime detection only, no cloud backend,
upstream default rules off, alert cooldown off. Rendered ahead of time rather than nested
because the extension renders one chart into the shoot ManagedResource and GRM, not helm,
owns the objects, so helm hooks and lookup() would never run.
Regenerate with `helm template` and the same values when the pin moves. The rule set lives
in kubescape-rules.yaml.
*/}}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.honey }}
---
