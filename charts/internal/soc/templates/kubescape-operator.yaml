              "endpoints",
              "imageID",
              "imageTag",
              "rulePolicies",
              "identifiedCallStacks",
              "labelSelector"
            ]
          },
          "overlay": {
            "signers": [
              "key:58fd31c363a8fac06d6eb596c2e8c63d5913b4dc4b971ee62579ec41fff78826"
            ],
