{{- if .Values.kubescape.enabled }}
{{/*
Static render of kubescape-operator 1.41.0-duckling46 with soc's values (runtime detection
only, offline, alertCRD.installDefault=false, cooldown off). The chart is rendered ahead
of time rather than nested because the extension renders ONE chart into the shoot
ManagedResource and GRM, not helm, owns the objects: helm hooks and lookup() would not run.
Regenerate with helm template + the same values when the kubescape pin moves.
Rules are soc's own (kubescape-rules.yaml), hence no upstream defaults here.
*/}}
