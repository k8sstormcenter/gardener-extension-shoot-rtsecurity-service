                          - vulnerable_code_cannot_be_controlled_by_adversary
                          - inline_mitigations_already_exist
                      impactStatement:
                        type: string
                      expiredOnFix:
                        type: boolean
                posture:
                  type: array
                  items:
                    type: object
                    required:
                      - controlID
                      - action
                    properties:
                      controlID:
                        type: string
                      frameworkName:
                        type: string
                      action:
                        type: string
                        enum:
                          - ignore
                          - alert_only
