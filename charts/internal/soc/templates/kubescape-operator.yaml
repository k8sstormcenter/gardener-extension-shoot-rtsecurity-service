# Root-signed trust policy enabling signed-bundle (SBoB) overlays.
#
# node-agent verifies this artifact against the root public key compiled into
# its image and leaves bundle overlays DISABLED if the signature or the root pin
# fails. There is no signing key here and none anywhere on the cluster: the
# agent only verifies.
#
# It carries "classes" only, so signed-RULES support stays off and unsigned
# Rules objects keep being accepted.
#
# Regenerate:
#   sign-object sign-policy --policy trust-policy.profiles-only.json \
#     --key <root>.pem --output trust-policy.profiles-only.signed.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: node-agent-bundle-policy
  namespace: {{ .Values.namespaces.honey }}
  labels:
    kubescape.io/ignore: "true"
data:
  trust-policy.json: |
    {
      "policy": {
{{- if ne .Values.kubescape.mode "default" }}
        "mode": {{ .Values.kubescape.mode | quote }},
{{- end }}
        "classes": {
          "admission": {
            "signers": [
              "key:58fd31c363a8fac06d6eb596c2e8c63d5913b4dc4b971ee62579ec41fff78826"
            ],
            "allowedSpecPaths": [
