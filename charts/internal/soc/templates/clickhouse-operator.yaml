  01-clickhouse-operator-profile.xml: "<!-- IMPORTANT -->\n<!-- This file is auto-generated\
    \ -->\n<!-- Do not edit this file - all changes would be lost -->\n<!-- Edit appropriate\
    \ template in the following folder: -->\n<!-- deploy/builder/templates-config\
    \ -->\n<!-- IMPORTANT -->\n<!--\n#\n# Template parameters available:\n#\n-->\n\
    <yandex>\n    <!-- clickhouse-operator user is generated by the operator based\
    \ on config.yaml in runtime -->\n    <profiles>\n        <clickhouse_operator>\n\
    \            <log_queries>0</log_queries>\n            <skip_unavailable_shards>1</skip_unavailable_shards>\n\
    \            <http_connection_timeout>10</http_connection_timeout>\n         \
    \   <max_concurrent_queries_for_all_users>0</max_concurrent_queries_for_all_users>\n\
    \            <os_thread_priority>0</os_thread_priority>\n        </clickhouse_operator>\n\
    \    </profiles>\n</yandex>\n"
  02-clickhouse-default-profile.xml: "<!-- IMPORTANT -->\n<!-- This file is auto-generated\
    \ -->\n<!-- Do not edit this file - all changes would be lost -->\n<!-- Edit appropriate\
    \ template in the following folder: -->\n<!-- deploy/builder/templates-config\
    \ -->\n<!-- IMPORTANT -->\n<yandex>\n  <profiles>\n    <default>\n      <os_thread_priority>2</os_thread_priority>\n\
    \      <log_queries>1</log_queries>\n      <connect_timeout_with_failover_ms>1000</connect_timeout_with_failover_ms>\n\
    \      <distributed_aggregation_memory_efficient>1</distributed_aggregation_memory_efficient>\n\
    \      <parallel_view_processing>1</parallel_view_processing>\n      <do_not_merge_across_partitions_select_final>1</do_not_merge_across_partitions_select_final>\n\
    \      <load_balancing>nearest_hostname</load_balancing>\n      <prefer_localhost_replica>0</prefer_localhost_replica>\n\
    \      <!-- materialize_ttl_recalculate_only>1</materialize_ttl_recalculate_only>\
    \ 21.10 and above -->\n    </default>\n  </profiles>\n</yandex>"
