data:
  config.yaml: "annotation:\n  exclude: []\n  include: []\nclickhouse:\n  access:\n\
    \    password: \"\"\n    port: 8123\n    rootCA: \"\"\n    scheme: auto\n    secret:\n\
    \      name: 'clickhouse-operator-altinity-clickhouse-operator'\n      namespace:\
    \ \"\"\n    timeouts:\n      connect: 5\n      query: 4\n    username: \"\"\n\
    \  addons:\n    rules:\n    - spec:\n        configuration:\n          files:\
    \ null\n          profiles: null\n          quotas: null\n          settings:\
    \ null\n          users: null\n      version: '*'\n    - spec:\n        configuration:\n\
    \          files: null\n          profiles: null\n          quotas: null\n   \
    \       settings: null\n          users:\n            '{clickhouseOperatorUser}/access_management':\
    \ 1\n            '{clickhouseOperatorUser}/named_collection_control': 1\n    \
    \        '{clickhouseOperatorUser}/show_named_collections': 1\n            '{clickhouseOperatorUser}/show_named_collections_secrets':\
    \ 1\n      version: '>= 23.3'\n    - spec:\n        configuration:\n         \
    \ files: null\n          profiles:\n            clickhouse_operator/format_display_secrets_in_show_and_select:\
    \ 1\n          quotas: null\n          settings:\n            display_secrets_in_show_and_select:\
    \ 1\n          users: null\n      version: '>= 23.5'\n  configuration:\n    file:\n\
    \      path:\n        common: chi/config.d\n        host: chi/conf.d\n       \
    \ user: chi/users.d\n    network:\n      hostRegexpTemplate: (chi-{chi}-[^.]+\\\
    d+-\\d+|clickhouse\\-{chi})\\.{namespace}\\.svc\\.cluster\\.local$\n    user:\n\
    \      default:\n        networksIP:\n        - ::1\n        - 127.0.0.1\n   \
    \     password: default\n        profile: default\n        quota: default\n  configurationRestartPolicy:\n\
    \    rules:\n    - rules:\n      - settings/*: \"yes\"\n      - settings/access_control_path:\
    \ \"no\"\n      - settings/dictionaries_config: \"no\"\n      - settings/max_server_memory_*:\
    \ \"no\"\n      - settings/max_*_to_drop: \"no\"\n      - settings/max_concurrent_queries:\
    \ \"no\"\n      - settings/models_config: \"no\"\n      - settings/user_defined_executable_functions_config:\
    \ \"no\"\n      - settings/logger/*: \"no\"\n      - settings/macros/*: \"no\"\
    \n      - settings/remote_servers/*: \"no\"\n      - settings/user_directories/*:\
    \ \"no\"\n      - settings/display_secrets_in_show_and_select: \"no\"\n      -\
    \ zookeeper/*: \"no\"\n      - files/*.xml: \"yes\"\n      - files/config.d/*.xml:\
    \ \"yes\"\n      - files/config.d/*dict*.xml: \"no\"\n      - files/config.d/*no_restart*:\
    \ \"no\"\n      - profiles/default/background_*_pool_size: \"yes\"\n      - profiles/default/max_*_for_server:\
    \ \"yes\"\n      version: '*'\n    - rules:\n      - settings/logger: \"yes\"\n\
    \      version: 21.*\n  metrics:\n    tablesRegexp: ^(metrics|custom_metrics)$\n\
    \    timeouts:\n      collect: 9\nkeeper:\n  configuration:\n    file:\n     \
    \ path:\n        common: chk/keeper_config.d\n        host: chk/conf.d\n     \
    \   user: chk/users.d\nlabel:\n  appendScope: \"no\"\n  exclude: []\n  include:\
    \ []\nlogger:\n  alsologtostderr: \"false\"\n  log_backtrace_at: \"\"\n  logtostderr:\
    \ \"true\"\n  stderrthreshold: \"\"\n  v: \"1\"\n  vmodule: \"\"\nmetrics:\n \
    \ labels:\n    exclude: []\npod:\n  terminationGracePeriod: 30\nreconcile:\n \
    \ host:\n    drop:\n      replicas:\n        active: false\n        onDelete:\
    \ true\n        onLostVolume: true\n    wait:\n      exclude: true\n      include:\
    \ false\n      probes:\n        readiness: true\n        startup: false\n    \
    \  queries: true\n      replicas:\n        all: false\n        delay: 10\n   \
    \     new: true\n  runtime:\n    reconcileCHIsThreadsNumber: 10\n    reconcileShardsMaxConcurrencyPercent:\
    \ 50\n    reconcileShardsThreadsNumber: 5\n  statefulSet:\n    create:\n     \
    \ onFailure: ignore\n    recreate:\n      onDataLoss: recreate\n      onUpdateFailure:\
    \ recreate\n    update:\n      onFailure: abort\n      pollInterval: 5\n     \
    \ timeout: 300\nstatefulSet:\n  revisionHistoryLimit: 0\nstatus:\n  fields:\n\
    \    action: false\n    actions: false\n    error: true\n    errors: true\ntemplate:\n\
    \  chi:\n    path: chi/templates.d\n    policy: ApplyOnNextReconcile\n  chk:\n\
    \    path: chk/templates.d\n    policy: ApplyOnNextReconcile\nwatch:\n  namespaces:\
    \ []"
