{{- if .Values.target.arc.enabled }}
{{/*
The runner scale set, from the upstream gha-runner-scale-set chart as CNCF renders it for
container runners, with three deliberate changes:
  - the pod template carries the profile binding. The controller copies template labels
    onto every runner pod verbatim, so each runner is governed from its first event; a pod
    that starts unlabelled is deny-all until something notices.
  - the sniffing window is a label too, because a runner pod lives for one job and the
    cluster-wide window is sized for services.
  - node placement and the listener's metrics are dropped: both described one specific
    cluster, and a shoot schedules runners wherever it can.
The scale set and its profile must be delivered together: the label resolves by name, and
a name that resolves to nothing leaves every runner ungoverned with only a counter to say so.
*/}}
{{- $ns := .Values.target.namespace }}
{{- $name := .Values.target.profileName }}
{{- $arc := .Values.target.arc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: github-arc-secret
  namespace: {{ $ns }}
type: Opaque
stringData:
  github_token: {{ required "credentials.arcGithubToken is required when target.arc.enabled: the scale set registers with it" $.Values.credentials.arcGithubToken | quote }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: '{{ $name }}-gha-rs-no-permission'
  namespace: {{ $ns }}
  labels:
    helm.sh/chart: gha-rs-0.14.1
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ $name }}
    app.kubernetes.io/version: 0.14.1
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: gha-rs
    actions.github.com/scale-set-name: {{ $name }}
    actions.github.com/scale-set-namespace: {{ $ns }}
  finalizers:
  - actions.github.com/cleanup-protection
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: '{{ $name }}-gha-rs-manager'
  namespace: {{ $ns }}
  labels:
    helm.sh/chart: gha-rs-0.14.1
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ $name }}
    app.kubernetes.io/version: 0.14.1
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: gha-rs
    actions.github.com/scale-set-name: {{ $name }}
    actions.github.com/scale-set-namespace: {{ $ns }}
    app.kubernetes.io/component: manager-role
  finalizers:
  - actions.github.com/cleanup-protection
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - create
  - delete
  - get
- apiGroups:
  - ''
  resources:
  - pods/status
  verbs:
  - get
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
- apiGroups:
  - ''
  resources:
  - serviceaccounts
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - rolebindings
  verbs:
  - create
  - delete
  - get
  - patch
  - update
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - roles
  verbs:
  - create
  - delete
  - get
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: '{{ $name }}-gha-rs-manager'
  namespace: {{ $ns }}
  labels:
    helm.sh/chart: gha-rs-0.14.1
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ $name }}
    app.kubernetes.io/version: 0.14.1
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: gha-rs
    actions.github.com/scale-set-name: {{ $name }}
    actions.github.com/scale-set-namespace: {{ $ns }}
    app.kubernetes.io/component: manager-role-binding
  finalizers:
  - actions.github.com/cleanup-protection
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: '{{ $name }}-gha-rs-manager'
subjects:
- kind: ServiceAccount
  name: cncf-gha-rs-controller
  namespace: {{ $ns }}
---
apiVersion: actions.github.com/v1alpha1
kind: AutoscalingRunnerSet
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/component: autoscaling-runner-set
    helm.sh/chart: gha-rs-0.14.1
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ $name }}
    app.kubernetes.io/version: 0.14.1
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: gha-rs
    actions.github.com/scale-set-name: {{ $name }}
    actions.github.com/scale-set-namespace: {{ $ns }}
  annotations:
    actions.github.com/values-hash: 5a160ea308cd51d6f4c27515e5040d9dc34be0acda7289ea0d7ad9cffff39e1
    actions.github.com/cleanup-manager-role-binding: cncf-c-ubuntu-2-8-x86-gha-rs-manager
    actions.github.com/cleanup-manager-role-name: cncf-c-ubuntu-2-8-x86-gha-rs-manager
    actions.github.com/cleanup-no-permission-service-account-name: cncf-c-ubuntu-2-8-x86-gha-rs-no-permission
spec:
  githubConfigUrl: {{ $arc.githubConfigUrl }}
  githubConfigSecret: github-arc-secret
  maxRunners: {{ $arc.maxRunners }}
  minRunners: {{ $arc.minRunners }}
  template:
    spec:
      containers:
      - command:
        - /home/runner/run.sh
        env:
        - name: DOCKER_HOST
          value: unix:///var/run/docker.sock
        - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
          value: '120'
        image: {{ $arc.runnerImage }}
        name: runner
        resources:
          limits:
            cpu: {{ $arc.resources.limits.cpu }}
            memory: {{ $arc.resources.limits.memory }}
          requests:
            cpu: {{ $arc.resources.requests.cpu }}
            memory: {{ $arc.resources.requests.memory }}
        volumeMounts:
        - mountPath: /home/runner/_work
          name: work
          subPath: _work
        - mountPath: /home/runner/.cache
          name: work
          subPath: .cache
        - mountPath: /home/runner/.gradle
          name: work
          subPath: .gradle
        - mountPath: /home/runner/go
          name: work
          subPath: go
        - mountPath: /home/runner/.m2
          name: work
          subPath: .m2
        - mountPath: /var/run
          name: dind-sock
        - mountPath: /tmp
          name: work
          subPath: tmp
      - args:
        - dockerd
        - --host=unix:///var/run/docker.sock
        - --group=$(DOCKER_GROUP_GID)
        - --data-root=/docker/
        - --mtu=1400
        - --default-network-opt=bridge=com.docker.network.driver.mtu=1400
        env:
        - name: DOCKER_GROUP_GID
          value: '123'
        image: {{ $arc.dindImage }}
        name: dind
        securityContext:
          privileged: true
        volumeMounts:
        - mountPath: /home/runner/_work
          name: work
          subPath: _work
        - mountPath: /var/run
          name: dind-sock
        - mountPath: /home/runner/externals
          name: dind-externals
        - mountPath: /home/runner/.cache
          name: work
          subPath: .cache
        - mountPath: /home/runner/.gradle
          name: work
          subPath: .gradle
        - mountPath: /home/runner/go
          name: work
          subPath: go
        - mountPath: /home/runner/.m2
          name: work
          subPath: .m2
        - mountPath: /docker
          name: work
          subPath: docker
        - mountPath: /tmp
          name: work
          subPath: tmp
        - mountPath: /lib/modules
          name: modules
          readOnly: true
        - mountPath: /sys/fs/cgroup
          name: cgroup
      initContainers:
      - command:
        - chmod
        - -R
        - '1777'
        - /tmp
        image: {{ $arc.chownerImage }}
        name: chowner
        securityContext:
          capabilities:
            add:
            - CHOWN
            drop:
            - all
          readOnlyRootFilesystem: true
          runAsNonRoot: false
          runAsUser: 0
        volumeMounts:
        - mountPath: /tmp
          name: work
          subPath: tmp
      - args:
        - -r
        - -v
        - /home/runner/externals/.
        - /home/runner/tmpDir/
        command:
        - cp
        image: {{ $arc.runnerImage }}
        name: init-dind-externals
        volumeMounts:
        - mountPath: /home/runner/tmpDir
          name: dind-externals
      restartPolicy: Never
      securityContext:
        fsGroup: 1001
        supplementalGroups:
        - 999
      serviceAccountName: cncf-c-ubuntu-2-8-x86-gha-rs-no-permission
      volumes:
      - name: modules
        hostPath:
          path: /lib/modules
          type: Directory
      - name: cgroup
        hostPath:
          path: /sys/fs/cgroup
          type: Directory
      - emptyDir: {}
        name: dind-sock
      - emptyDir: {}
        name: dind-externals
      - emptyDir:
          sizeLimit: {{ $arc.workSizeLimit }}
        name: work
    metadata:
      labels:
        kubescape.io/user-defined-profile: {{ $.Values.target.profileName }}
        kubescape.io/max-sniffing-time: {{ $.Values.kubescape.learn.runnerSniffingTime }}
{{- end }}
