apiVersion: v1
kind: Secret
metadata:
  name: extension-shoot-rtsecurity-service-config
  namespace: {{ .Release.Namespace }}	
stringData:
  config.yaml: |
    apiVersion: rtsecurity.extensions.config.gardener.cloud/v1alpha1
    kind: Configuration
{{- if .Values.healthCheckConfig }}
    healthCheckConfig:
      {{- toYaml .Values.healthCheckConfig | nindent 6 }}
{{- end }}
