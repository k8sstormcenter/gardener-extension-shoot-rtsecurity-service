{{- if .Values.gardenKubeconfig.inCluster }}
{{/*
GARDEN_KUBECONFIG must be a FILE PATH: the actuator calls
kubernetes.RESTConfigFromKubeconfigFile(os.Getenv("GARDEN_KUBECONFIG"), kubernetes.AuthTokenFile),
so an in-cluster rest.Config is not enough and the env var cannot simply be omitted.

In this fork the garden and the seed are the same cluster, so the kubeconfig points at
kubernetes.default.svc and authenticates with the pod's own projected service account
token. AuthTokenFile is what makes the tokenFile form acceptable.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: gardener-extension-{{ .Values.serviceName }}-garden-kubeconfig
  namespace: {{ .Release.Namespace }}
data:
  kubeconfig: |
    apiVersion: v1
    kind: Config
    current-context: garden
    clusters:
    - name: garden
      cluster:
        certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        server: https://kubernetes.default.svc
    users:
    - name: garden
      user:
        tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    contexts:
    - name: garden
      context:
        cluster: garden
        user: garden
{{- end }}
