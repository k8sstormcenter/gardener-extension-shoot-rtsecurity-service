---
serviceName: shoot-rtsecurity-service

# Resolved by the actuator at startup via getSeed(); the pod exits if it is wrong. Defaults
# to the single-cluster landscape's seed so the chart renders with defaults (check-charts
# renders every chart that way); `required` in the template still rejects an explicit "".
seedName: local

# garden == seed in this fork's landscape, so the extension talks to the garden with its
# own service account rather than a kubeconfig gardenlet would otherwise provide.
gardenKubeconfig:
  inCluster: true

# Upstream sets automountServiceAccountToken: false and relies on gardener-resource-
# manager's projected-token webhook to inject a token. That webhook is off in this
# landscape, so with false the pod has no in-cluster credentials at all: controller-runtime
# falls back to ~/.kube/config and exits in flag parsing before any controller starts. The
# same mount also backs the tokenFile garden kubeconfig above.
serviceAccount:
  automountToken: true
replicaCount: 2

ignoreResources: false

# PriorityClass of the extension controller itself.
extensionPriorityClassName: gardener-system-900

image:
  repository: ghcr.io/k8sstormcenter/gardener-extension-shoot-rtsecurity-service
  pullPolicy: IfNotPresent

podLabels: {}

metrics:
  enableScraping: true
  port: 8080

vpa:
  enabled: true
  resourcePolicy:
    minAllowed:
      memory: 64Mi
  updatePolicy:
    updateMode: "InPlaceOrRecreate"
