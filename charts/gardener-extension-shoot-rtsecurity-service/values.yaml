---
serviceName: shoot-rtsecurity-service

# Resolved by the actuator at startup via getSeed(); the pod exits if it is wrong. Defaults
# to the single-cluster landscape's seed so the chart renders with defaults (check-charts
# renders every chart that way); `required` in the template still rejects an explicit "".
seedName: local

# garden == seed in this fork's landscape, so the extension talks to the garden with its
# own service account rather than a kubeconfig gardenlet would otherwise provide.
gardenKubeconfig:
  inCluster: true

# Upstream sets automountServiceAccountToken: false and relies on gardener-resource-
# manager's projected-token webhook to inject a token. That webhook is off in this
# landscape, so with false the pod has no in-cluster credentials at all: controller-runtime
# falls back to ~/.kube/config and exits in flag parsing before any controller starts. The
# same mount also backs the tokenFile garden kubeconfig above.
serviceAccount:
  automountToken: true
replicaCount: 2

ignoreResources: false

# PriorityClass to use for Falco extension deployment
extensionPriorityClassName: gardener-system-900

image:
  repository: europe-docker.pkg.dev/gardener-project/public/gardener/extensions/shoot-falco-service
  pullPolicy: IfNotPresent

podLabels: {}

metrics:
  enableScraping: true
  port: 8080

vpa:
  enabled: true
  resourcePolicy:
    minAllowed:
      memory: 64Mi
  updatePolicy:
    updateMode: "InPlaceOrRecreate"

falco:
  # PriorityClass to use for Falco shoot deployment
  priorityClassName: ""

  # Lifetime of the CA certificates
  certificateLifetime: "8760h"

  # Renew CA certificates after this duration
  certificateRenewAfter: "8000h"

  centralStorage:
    # Enable centralized storage
    enabled: false

    # Centralized storage URL
    url: ""

    # Token lifetime
    tokenLifetime: "168h"

    # Private key for token issuer
    tokenIssuerPrivateKey: ""

  # Cluster identity token configuration for global default destinations.
  # When configured, enables the <<.ClusterIdentityToken>> template variable
  # which is replaced with a per-shoot JWT at reconcile time.
  # clusterIdentityToken:
  #   tokenIssuerPrivateKey: ""
  #   tokenLifetime: "168h"

  # Global default destinations applied to all shoots unless opted out.
  # Each entry has: name (unique identifier), falcosidekickOutput.key (output type),
  # falcosidekickOutput.value (config map, supports <<.SeedIngressDomain>> and <<.ServiceAccountToken>> templates)
  # globalDefaultDestinations:
  # - name: "central-splunk"
  #   falcosidekickOutput:
  #     key: "splunk"
  #     value:
  #       host: "https://falco-splunk.<<.SeedIngressDomain>>"
  #       token: "<<.ServiceAccountToken>>"
  #       checkcert: true
  globalDefaultDestinations: []
