#
# Rendered by `make extension-up`: the bare local-skaffold/... refs only resolve through
# skaffold, so never kubectl apply this file directly.
apiVersion: operator.gardener.cloud/v1alpha1
kind: Extension
metadata:
  name: extension-shoot-rtsecurity-service
spec:
  resources:
    - kind: Extension
      type: shoot-rtsecurity-service
      globallyEnabled: false
      workerlessSupported: false
  deployment:
    extension:
      helm:
        ociRepository:
          ref: local-skaffold/gardener-extension-shoot-rtsecurity-service/charts/extension
      injectGardenKubeconfig: true
      runtimeClusterValues:
        extensionPriorityClassName: gardener-system-900
        image:
          repository: local-skaffold/gardener-extension-shoot-rtsecurity-service
        podLabels:
          networking.gardener.cloud/to-private-networks: allowed
        replicaCount: 1
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
        vpa:
          enabled: true
          resourcePolicy:
            minAllowed:
              memory: 128Mi
      values:
        extensionPriorityClassName: gardener-system-900
        image:
          repository: local-skaffold/gardener-extension-shoot-rtsecurity-service
