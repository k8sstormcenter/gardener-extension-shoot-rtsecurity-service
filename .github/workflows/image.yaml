# Fork image build.
#
# The upstream workflows (build.yaml, release.yaml) call gardener/cc-utils reusable
# workflows that publish into gardener's own OCI/OCM registry, which a fork has no
# credentials for. This one is self-contained: buildx -> ghcr.io under this org, using
# GITHUB_TOKEN.
#
# Dockerfile stage, binary and image share the shoot-rtsecurity-service name.
name: image

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', '.claude/**']
  workflow_dispatch:
    inputs:
      tag:
        description: Extra tag to publish alongside the commit sha and latest
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Effective version
        id: v
        run: |
          # VERSION file carries e.g. v0.97.0-dev; the published tags are the commit sha
          # and latest, so a rebuild of the same sha is always identifiable.
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push extension
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: gardener-extension-shoot-rtsecurity-service
          platforms: linux/amd64
          push: true
          build-args: |
            EFFECTIVE_VERSION=${{ steps.v.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/gardener-extension-shoot-rtsecurity-service:latest
            ghcr.io/${{ github.repository_owner }}/gardener-extension-shoot-rtsecurity-service:${{ steps.v.outputs.sha }}
            ${{ inputs.tag && format('ghcr.io/{0}/gardener-extension-shoot-rtsecurity-service:{1}', github.repository_owner, inputs.tag) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The seed-side chart. Consumers pull it from oci:// instead of copying the directory,
  # which is how the vendored copy in SovereignSOC drifted from the fork within a day.
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Chart version + sha
        id: v
        run: |
          echo "chart=$(grep -E '^version:' charts/gardener-extension-shoot-rtsecurity-service/Chart.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
      # The shoot chart carries the vendored render in full, so it is published only while its
      # package is private. This is a gate and not a comment because the ordering is forced and
      # easy to get wrong: visibility belongs to a PACKAGE, and a package does not exist until
      # something pushes to it, so the first push necessarily lands at whatever the default is.
      # This org's default is public - the extension image and chart are both anonymously
      # pullable - and that is how a soc chart was once published in the open. Asking the API
      # costs one call and turns "remember to set it private first" into something enforced.
      #
      # A missing package is not a failure: the first push has to come from somewhere, and it
      # is meant to be a deliberate manual one so the visibility can be set before any build
      # repeats it. So absent means skip, public means fail, private means publish.
      - name: Is the shoot chart's package private
        id: vis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          out=$(gh api "orgs/${{ github.repository_owner }}/packages/container/charts%2Fsoc" \
                  --jq .visibility 2>/dev/null) || out=""
          case "$out" in
            private) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            public)
              # Loud, but it must not fail the job: the extension chart is pushed by the next
              # step and SovereignSOC pins that artefact by sha, so failing here would stop
              # every future pin over a decision about a different chart. Not publishing is
              # already the safe outcome; the warning is what carries it to a human.
              echo "::warning::charts/soc is a PUBLIC package, so the shoot chart was NOT published. Set the package private to publish it. The extension chart is unaffected."
              echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::notice::charts/soc is not published yet (or packages:read is unavailable), so the shoot chart is skipped. Push it once by hand, set the package private, then this gate takes over."
              echo "publish=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Package and push
        run: |
          set -euo pipefail
          CHART=charts/gardener-extension-shoot-rtsecurity-service
          # Two tags: the plain chart version (moves with main) and a sha-suffixed
          # prerelease that never moves. OCI tags cannot carry '+', so prerelease form.
          helm package "$CHART" --version "${{ steps.v.outputs.chart }}" -d /tmp/out
          helm package "$CHART" --version "${{ steps.v.outputs.chart }}-${{ steps.v.outputs.sha }}" -d /tmp/out
          # The shoot-side chart belongs here too, so a GitOps cluster renders the artefact
          # this build renders rather than a copy of it, versioned with the EXTENSION's chart
          # version and the sha so one artefact serves staging and prod. Guarded below: it is
          # published only while the package is private, because it carries the vendored
          # render in full.
          if [ "${{ steps.vis.outputs.publish }}" = "true" ]; then
            helm package charts/internal/soc \
              --version "${{ steps.v.outputs.chart }}-${{ steps.v.outputs.sha }}" -d /tmp/out
          fi
          for tgz in /tmp/out/*.tgz; do helm push "$tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"; done
